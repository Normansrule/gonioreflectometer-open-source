# Validation numbers for the paper's "Validation and characterization" section (HardwareX).
# Each row is measured by one roadmap step (.github/phases.yml) with that step's own pass criterion. Leave `value`
# null until the step is done, then copy the number from the step's record (phases/<stage>/design.md → Results).
# `make paper` turns this file into paper/generated/validation.tex; `make paper-check` lists what is still missing.
# Never type a value that was not measured.
# SPDX-License-Identifier: CC-BY-SA-4.0

