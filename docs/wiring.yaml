# OpenGonio wiring: every electrical connection, pin by pin. SOURCE OF TRUTH for the README "Wiring" section and
# docs/assets/wiring.svg (`python tools/wiring.py`, run by `make build`). `python tools/wiring.py --check` (in `make check`)
# compares the pins here with firmware/hub/main.py, the SKR Pico pin map and machine.yaml, and flags a header pin used twice.
#
# A connection is [from, to, wire, note]. An end is PART:PIN.
#   SKR:<port>.<n>   BTT SKR Pico V1.0 connector, pin n counted left to right as drawn in the maker pin diagram [C12]
#   SKR:<port>.<label>  a screw terminal by its printed label (POWER, HE, HB)
#   HUB:J1-<n> / HUB:J3-<n>  ESP32-S3-DevKitC-1 header pin [R86]; the GPIO is printed next to it on the board
#   PI:<n>           Raspberry Pi Zero 2 W 40-pin header, physical pin n [H51]
#   anything else:   PART:terminal as printed on the module (part IDs from the BOM)
# Stages: the stage that first makes the connection. Rows with `blocked: true` must NOT be wired.

alternatives:          # part: the part whose header pins it may reuse (fit one or the other on those pins)
  OLED: SPEC

hub_pins:              # ESP32-S3 header pins that are not wired but matter: kept free for the firmware, or avoided [R86]
  reserved:            # firmware/hub/main.py I2C_PAIRS 2-4: optional AS5600 angle encoders (no part in the list yet)
    J3-8: "AS5600 encoder 1 SCL (optional)"
    J3-9: "AS5600 encoder 1 SDA (optional)"
  shared:              # I2C_PAIRS 3-4: the status screen when it is fitted (SCREEN ON), else AS5600 encoders 2-3
    J3-6: "status screen CLK, or AS5600 encoder 2 SCL"
    J3-7: "status screen DIN, or AS5600 encoder 2 SDA"
    J1-11: "status screen DC, or AS5600 encoder 3 SCL"
    J3-10: "status screen CS, or AS5600 encoder 3 SDA (RGB LED on v1.1 boards)"
  avoid:
    J1-3: "reset (EN)"
    J1-13: "strapping pin"
    J1-14: "strapping pin"
    J3-2: "UART0 console"
    J3-3: "UART0 console"
    J3-11: "flash / PSRAM (octal modules)"
    J3-12: "flash / PSRAM (octal modules)"
    J3-13: "flash / PSRAM (octal modules)"
    J3-14: "strapping pin (BOOT button)"
    J3-15: "strapping pin"
    J3-19: "USB D+ (the USB connector)"
    J3-20: "USB D− (the USB connector)"

parts:
  SKR: "SKR Pico (CTL-01)"
  HUB: "ESP32-S3 hub (CTL-02)"
  PI: "Pi Zero 2 W (STA-01)"
  ADAPTER: "24 V wall adapter (PWR-30)"
  JACK: "Screw-terminal jack (with PWR-30)"
  ESTOP: "E-stop box (PWR-28)"
  OT: "Limit switch, over-travel (LAR-06)"
  CAP: "Blue-wire cap (WAGO 221-2401)"
  OTA: "Splice A, e-stop side (WAGO 221-2401)"
  OTB: "Splice B, tray side (WAGO 221-2401)"
  OPTO: "Opto module (PWR-10)"
  MOT+: "Lever connector MOT+ (3-way, on the tray)"
  MOT-: "Lever connector MOT− (3-way, on the tray)"
  LAMPDRV: "Lamp driver NLDD-350HW (LSR-02)"
  LAMP: "COB lamp in holder (LSR-01 + LSR-06)"
  M4: "M4 motor, light arm (LAR-02)"
  M3: "M3 motor, table (TBL-01)"
  M2: "M2 motor, tilt (TLT-01)"
  M1: "M1 pancake, spin (SPN-01)"
  ES4: "M4 endstop (LAR-05)"
  ES3: "M3 endstop (TBL-04)"
  ES2: "M2 endstop (TLT-04)"
  ES1: "M1 endstop (SPN-04)"
  KPA: "Keypad A (CTL-05)"
  KPB: "Keypad B (CTL-05)"
  LAPTOP: "Laptop"
  CAM: "Camera (CAM-01)"
  FAN: "40 mm fan (CTL-08, optional)"
  SPEC: "AS7341 sensor (SPC-01, optional)"
  OLED: "OLED (STA-05, optional)"
  BUCK: "5 V buck (STA-03, optional)"
  USBHUB: "Powered USB hub ([TBD], optional)"
  SPLICE: "Lever connectors (WAGO 221-412 / 415)"
  HGND: "Lever connector keypad GND (3-way)"
  V3R: "Lever connector hub 3V3 (WAGO 221-415, 5-way)"
  SGND: "Lever connector sensor GND (WAGO 221-413, 3-way)"
  TFT: "Status screen, Waveshare 2 in (STA-09, optional)"
  LASER: "Alignment laser (LAR-09, tool)"
  BANK: "Colour LED bank (MSK-01…03)"

groups:
  - title: "1 · Power: wall adapter, jack, e-stop"
    stage: "01"
    intro: >-
      The adapter stays outside the machine and goes into the wall **last** (M06; before that only for the jack check in M04.2). 18 AWG (PWR-15) red for `+`, black for
      `−`. Strip 8 mm for screw terminals, 11 mm for lever connectors; twist the strands; tug-test every wire. On the
      BAOMAIN e-stop the NC contact is terminals 1 and 2 (NO = 3 and 4): check with the meter, 1–2 beep with the button
      released and open when it is pressed. Either gap under a terminal screw is the same terminal.
    checks:
      - "Adapter unplugged, e-stop released: continuity jack + to e-stop NC 2 (beep); press the e-stop: open."
      - "Jack + to jack −: OL (no short)."
    rows:
      - ["ADAPTER:round 24 V plug", "JACK:socket", "the adapter's own cable", "push fully in; the wall plug stays out (except the jack check in M04.2) until M06"]
      - ["JACK:+", "ESTOP:NC 1", "18 AWG red", "NC contact, not NO"]
      - ["JACK:−", "MOT-:1", "18 AWG black (the whole run to the tray)", "ground never goes through the e-stop"]
      - ["MOT-:3", "SKR:POWER.GND", "10 cm 18 AWG black offcut", "from M08.3"]

  - title: "2 · Motor power: e-stop → limit switch → SKR Pico"
    stage: "01–04"
    intro: >-
      One + line. Until M14.1 a red wire runs from e-stop NC 2 straight to MOT+; M14.1 cuts that run beside the limit
      switch and splices the switch in with two 221-2401s, so its own leads only need to reach the run (their length is
      not on the listing). The switch has its own wires: find them with the meter first (COM–NC beeps with the lever untouched and
      opens when the lever is pressed; on the units bought black = COM, grey = NC, blue = NO). Press the e-stop before
      touching any terminal.
    checks:
      - "Adapter unplugged: continuity e-stop NC 2 to MOT+ (beep); press the limit switch lever: open."
      - "Live (M06, M14.1): adapter in, e-stop released, DC volts MOT+ to MOT− ≈ +24 V; e-stop pressed or lever pressed: 0 V."
    rows:
      - ["ESTOP:NC 2", "OTA:red in", "18 AWG red (the red run, e-stop part)", "stage 04 (M14.1) cuts the run beside the switch; before that it runs on to MOT+ 1"]
      - ["OT:black (COM)", "OTA:black", "the switch's own wire", "11 mm stripped"]
      - ["OT:grey (NC)", "OTB:grey", "the switch's own wire", "connected to COM while the lever is untouched"]
      - ["OTB:red out", "MOT+:1", "18 AWG red (the red run, tray part)", ""]
      - ["OT:blue (NO)", "CAP:blue", "the switch's own wire", "unused: alone in a 221-2401 so the bare end is covered"]
      - ["MOT+:3", "SKR:POWER.12/24V", "10 cm 18 AWG red offcut", "from M08.3"]

  - title: "3 · SKR Pico: motors"
    stage: "02–09"
    intro: >-
      Motor sockets are 4-pin JST-XH 2.54 mm. Pins 1–4 = `2B 1B 1A 2A` (pin diagram, left to right). The schematic
      puts one driver coil on pins 1 + 4 (`2B`, `2A`) and the other on pins 2 + 3 (`1B`, `1A`). The 5-pack cables plug
      straight in. Check with the motor plugged in: meter on Ω at the plug's back, 1–4 and 2–3 each read a few ohms.
      Buzzing without turning = coil pairs crossed (move plug contacts until that check passes); wrong direction = `$3`
      in software, not wiring.
    rows:
      - ["M4:6-pin socket", "SKR:X.1-4", "5-pack cable (1 m)", "grblHAL X · stage 04"]
      - ["M3:6-pin socket", "SKR:Y.1-4", "5-pack cable (1 m)", "grblHAL Y · stage 05"]
      - ["M2:6-pin socket", "SKR:Z1.1-4", "5-pack cable (1 m)", "grblHAL Z · stage 08 (Z2 is the same driver: leave empty)"]
      - ["M1:coil pair 1 (2 bare leads)", "SPLICE:pair 1 (2 × 221-412)", "motor leads, 11 mm stripped, folded double", "pancake has bare leads: find the pairs first (M27.1)"]
      - ["SPLICE:pair 1 (2 × 221-412)", "SKR:E.1 + E.4", "spare 5-pack cable (6-pin plug cut off): the wires in plug pins 1 and 4", "driver coil 2B / 2A"]
      - ["M1:coil pair 2 (2 bare leads)", "SPLICE:pair 2 (221-412 + 221-415)", "motor leads, 11 mm stripped, folded double", ""]
      - ["SPLICE:pair 2 (221-412 + 221-415)", "SKR:E.2-3", "same cable: the wires in plug pins 2 and 3", "driver coil 1B / 1A · grblHAL A · stage 09"]

  - title: "4 · SKR Pico: endstops (home switches)"
    stage: "02–09"
    intro: >-
      STOP ports are 3-pin JST-XH: pin 1 signal, pin 2 GND, pin 3 5 V. Leads: 3 CTL-06 pre-crimped wires in a 3-pin XH
      housing at the board end. At the module, put each wire on the pin with the matching printed label (S/OUT, G/GND,
      V/VCC): the module's pin order may differ from the board's. Before plugging in, meter the module's V pin to STOP
      pin 3 (beep). The SKR Pico buffers these inputs, so the module's 5 V signal is safe.
    rows:
      - ["ES4:S / G / V (by label)", "SKR:X-STOP.1-3", "CTL-06 lead", "M4 home at 20° · `Pn:X`"]
      - ["ES3:S / G / V (by label)", "SKR:Y-STOP.1-3", "CTL-06 lead", "M3 home · `Pn:Y`"]
      - ["ES2:S / G / V (by label)", "SKR:Z-STOP.1-3", "CTL-06 lead", "M2 home · `Pn:Z`"]
      - ["ES1:S / G / V (by label)", "SKR:E0-STOP.1-3", "CTL-06 lead", "M1 home · `Pn:A` (needs a 4-axis grblHAL build)"]

  - title: "5 · Lamp (white COB)"
    stage: "06"
    intro: >-
      The driver (NLDD-350HW) has five 22 AWG leads, 100 mm, stripped 5 mm: read which colour is which on its label.
      It is taped into its frame on the tray. HE is a low-side switch: its `IO23` terminal is the switched `−`.
      The holder's own leads are 15 cm of 18 AWG (PWR-15) pushed into its poke-in terminals (M18.1). Jumper ends that
      go into a lever connector: cut off the plug, strip 11 mm, fold double.
    rows:
      - ["LAMPDRV:+Vin", "SKR:HE.12/24V", "driver lead, bare end under the HE screw", "HE `+`: always at motor-power voltage"]
      - ["LAMPDRV:−Vin", "SKR:HE.IO23", "driver lead, bare end under the HE screw", "HE `−`, switched: `M62 P4` on / `M63 P4` off (check with `$PINS`)"]
      - ["LAMPDRV:+Vo", "LAMP:+ terminal", "driver lead → lever connector → chain of 5 M-F jumpers along the arm → lever connector → holder's red lead", "slack for 20–324° of arm travel"]
      - ["LAMPDRV:−Vo", "LAMP:− terminal", "driver lead → lever connector → chain of 5 M-F jumpers → lever connector → holder's black lead", ""]
      - ["LAMPDRV:DIM", "-", "its lead alone in a 2-way lever connector (insulated cap)", "open = on: never tie it to −Vin (that turns the lamp off)"]

  - title: "6 · Hub: keypads and motor-power sense"
    stage: "02"
    intro: >-
      ESP32-S3-DevKitC-1, header pin numbers from Espressif's user guide and pin-layout drawing: J1 = the long header on
      the side of the connector marked UART, J3 = the side of the connector marked USB; pin 1 at the antenna end, pins
      21–22 next to the USB-C connectors. The hub is mounted upside down (pins up), which mirrors the
      top-view drawing: wire it before mounting, or count pins from the antenna end; clones don't always print labels
      underneath. Male–female jumpers (CTL-07). The keypads' 5-pin tails: find the common pin with the meter first (M07.2). Both
      keypad commons share one GND pin through a 3-way lever connector, so a GND pin stays free for the Pi (stage 15).
    rows:
      - ["KPA:common", "HGND:1", "M-F jumper, female end cut and stripped", "fold the stripped end double in the lever connector"]
      - ["KPA:key 1", "HUB:J1-4", "M-F jumper", "HOME"]
      - ["KPA:key 2", "HUB:J1-5", "M-F jumper", "START"]
      - ["KPA:key 3", "HUB:J1-6", "M-F jumper", "STOP"]
      - ["KPA:key 4", "HUB:J1-7", "M-F jumper", "LIGHT"]
      - ["KPB:common", "HGND:2", "M-F jumper, female end cut and stripped", "fold double"]
      - ["HGND:3", "HUB:J1-22", "M-F jumper, male end cut and stripped", "GND · frees J3-1 for the Pi (stage 15)"]
      - ["KPB:key 1", "HUB:J1-8", "M-F jumper", "NEXT"]
      - ["KPB:key 2", "HUB:J1-9", "M-F jumper", "PAUSE (stops after the current pose)"]
      - ["KPB:key 3, key 4", "-", "not connected", "spare keys"]
      - ["MOT+:2", "OPTO:IN+", "short 18 AWG red", "24 V module; its resistor is on board"]
      - ["MOT-:2", "OPTO:IN−", "short 18 AWG black", "8 mm under the module screw, 11 mm in the lever connector"]
      - ["OPTO:VCC", "HUB:J1-1", "M-F jumper", "3V3 (not 5 V: the GPIO is 3.3 V)"]
      - ["OPTO:GND", "HUB:J3-21", "M-F jumper", "GND"]
      - ["OPTO:OUT", "HUB:J1-10", "M-F jumper", "motion-power sense: low = motor power on"]

  - title: "7 · USB data"
    stage: "02, 06"
    intro: >-
      Three USB ports on the laptop (Windows + WSL: `usbipd attach` each one). Use data cables, not charge-only.
    rows:
      - ["SKR:USB-C", "LAPTOP:USB-A", "CTL-03 USB-A to USB-C", "VID 0x2E8A · grblHAL serial"]
      - ["HUB:USB (not UART)", "LAPTOP:USB-A", "CTL-03 USB-A to USB-C", "VID 0x303A · panel + sensors"]
      - ["CAM:USB", "LAPTOP:USB-A", "camera's own cable", "UVC camera"]

  - title: "8 · Optional add-ons"
    stage: "02, 10, 15"
    intro: >-
      Only when you fit the part. The OLED and the AS7341 share one I2C bus (OLED 0x3C: check, some are 0x3D; AS7341
      0x39): with both fitted,
      wire the AS7341 to the hub and plug the OLED into the AS7341's second STEMMA QT socket (a STEMMA QT cable, not in
      the parts list yet [TBD]). Fan plug: check it fits FAN1 before relying on it. The hub has only two 3V3 and four GND
      pins, so the sensor and the status screen take 3V3 and GND from two lever connectors fed from J1-2 and J3-22 (cut
      jumper or cable ends, 11 mm stripped, folded double). Status screen (STA-09): Waveshare 2inch LCD Module, ST7789, 8-pin cable to
      female jumpers, on its printed stand (STA-10); it takes the pins of encoders 2-3, so send `SCREEN ON` to the hub once (it restarts) after wiring.
    rows:
      - ["FAN:red (+)", "SKR:FAN1.12/24V", "fan lead", "`M62 P2` (check with `$PINS`); advised above 0.8 A per motor"]
      - ["FAN:black (−)", "SKR:FAN1.IO17", "fan lead", "switched side"]
      - ["HUB:J1-2", "V3R:1", "M-F jumper, male end cut and stripped", "3V3 for the sensor and the screen"]
      - ["HUB:J3-22", "SGND:1", "M-F jumper, male end cut and stripped", "GND for the sensor and the screen"]
      - ["SPEC:VIN (red)", "V3R:2", "SPC-02 JST-SH to female, female end cut and stripped", "3V3"]
      - ["SPEC:GND (black)", "SGND:2", "SPC-02, female end cut and stripped", "GND"]
      - ["SPEC:SCL (yellow)", "HUB:J3-5", "SPC-02", "first I2C pair"]
      - ["SPEC:SDA (blue)", "HUB:J3-4", "SPC-02", "first I2C pair"]
      - ["OLED:VIN", "V3R:2", "female–female jumper (STA-06), one end cut", "only without the AS7341; with it, chain the OLED as above"]
      - ["OLED:GND", "SGND:2", "F-F jumper, one end cut", "only without the AS7341"]
      - ["OLED:SCL", "HUB:J3-5", "F-F jumper", "only without the AS7341"]
      - ["OLED:SDA", "HUB:J3-4", "F-F jumper", "only without the AS7341"]
      - ["TFT:VCC", "V3R:3", "screen cable, female end cut and stripped", "3V3"]
      - ["TFT:GND", "SGND:3", "screen cable, female end cut and stripped", "GND"]
      - ["TFT:RST", "V3R:4", "screen cable, female end cut and stripped", "held high: the firmware resets the screen by command"]
      - ["TFT:BL", "V3R:5", "screen cable, female end cut and stripped", "backlight always on"]
      - ["TFT:CLK", "HUB:J3-6", "screen cable", "SPI clock · `SCREEN ON`"]
      - ["TFT:DIN", "HUB:J3-7", "screen cable", "SPI data"]
      - ["TFT:DC", "HUB:J1-11", "screen cable", "data / command"]
      - ["TFT:CS", "HUB:J3-10", "screen cable", "chip select"]
      - ["LASER:+ / −", "SKR:RGB.3 / SKR:RGB.1", "2 jumpers", "bench tool: 5 V and GND of the unused RGB port"]

  - title: "9 · Standalone station (no laptop, optional)"
    stage: "15"
    intro: >-
      The Pi runs jobs; the hub talks to it over UART at 3.3 V. Hub module must be an ESP32-S3-WROOM-1 (3.3 V flash,
      as the N8R8 / N16R8 / plain boards in the parts list): on modules with 1.8 V flash, GPIO 47/48 run at 1.8 V and
      the Pi's 3.3 V TX would overdrive GPIO 48 (check the ESP32-S3 datasheet before using another module). Never power
      the hub from the Pi while its USB is in the laptop. Set the buck to 5.1 V **before** connecting the Pi. The powered
      USB hub is not in the parts list yet: part and its supply [TBD] (stage 15).
    rows:
      - ["PI:8", "HUB:J3-16", "F-F jumper", "Pi GPIO14 TX → hub GPIO48 RX"]
      - ["PI:10", "HUB:J3-17", "F-F jumper", "Pi GPIO15 RX ← hub GPIO47 TX"]
      - ["PI:6", "HUB:J3-1", "F-F jumper", "GND (UART and hub-power return)"]
      - ["PI:4", "HUB:J1-21", "F-F jumper", "Pi 5V powers the hub (5V pin)"]
      - ["JACK:+", "BUCK:IN+", "thin red, second wire under the jack screw", "before the e-stop: the Pi stays on when the motors stop"]
      - ["JACK:−", "BUCK:IN−", "thin black, second wire under the jack screw", ""]
      - ["BUCK:OUT+", "PI:2", "cut F jumper", "5.1 V"]
      - ["BUCK:OUT−", "PI:14", "cut F jumper", "GND"]
      - ["SKR:USB-C (+ camera USB)", "USBHUB:ports", "same cables as with the laptop", "hub on the Pi's micro-USB data port through the OTG adapter (STA-04); hub supply [TBD]"]

  - title: "10 · Not wired: colour LED bank"
    stage: "10"
    blocked: true
    intro: >-
      **BLOCKED (audit F09): do not wire or power.** The NLDD-350H cannot regulate one colour LED. Reserved pins, so
      nothing else takes them: SKR Pico HB (`M62 P3`, refused in software) and hub GPIO 8–14, 21.
    rows:
      - ["BANK:band 1 input", "HUB:J1-12", "-", "reserved"]
      - ["BANK:band 2 input", "HUB:J1-15", "-", "reserved"]
      - ["BANK:band 3 input", "HUB:J1-16", "-", "reserved"]
      - ["BANK:band 4 input", "HUB:J1-17", "-", "reserved"]
      - ["BANK:band 5 input", "HUB:J1-18", "-", "reserved"]
      - ["BANK:band 6 input", "HUB:J1-19", "-", "reserved"]
      - ["BANK:band 7 input", "HUB:J1-20", "-", "reserved"]
      - ["BANK:band 8 input", "HUB:J3-18", "-", "reserved"]
      - ["BANK:driver supply", "SKR:HB.IO21", "-", "reserved"]
