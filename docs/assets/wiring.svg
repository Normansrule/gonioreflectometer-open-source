<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 500" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1316" height="500" rx="14" fill="#0d1117"/>
<text x="24" y="34" fill="#f0f6fc" font-size="18" font-weight="600">Wiring overview</text><text x="24" y="54" fill="#8b949e" font-size="12">Red: 18–24 V motor power · grey: ground · blue: motor cables · green: home switches · purple: 3.3 V logic · yellow: USB. Pin-by-pin tables below.</text><rect x="24" y="84" width="230" height="76" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="36" y="106" fill="#f0f6fc" font-size="14" font-weight="600">Power (01)</text><text x="36" y="126" fill="#8b949e" font-size="11.5">24 V 3 A wall adapter</text><text x="36" y="142" fill="#8b949e" font-size="11.5">screw-terminal jack on the power plate</text><rect x="24" y="186" width="230" height="48" rx="9" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="36" y="208" fill="#f0f6fc" font-size="14" font-weight="600">E-stop box (NC contact)</text><rect x="24" y="260" width="230" height="48" rx="9" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="36" y="282" fill="#f0f6fc" font-size="14" font-weight="600">Limit switch (over-travel)</text><path d="M139,160 L139,186" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><path d="M139,234 L139,260" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="300" y="84" width="76" height="44" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="312" y="106" fill="#f0f6fc" font-size="14" font-weight="600">M4 arm</text><path d="M338,128 L338,170" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="381" y="84" width="76" height="44" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="393" y="106" fill="#f0f6fc" font-size="14" font-weight="600">M3 table</text><path d="M419,128 L419,170" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="462" y="84" width="76" height="44" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="474" y="106" fill="#f0f6fc" font-size="14" font-weight="600">M2 tilt</text><path d="M500,128 L500,170" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="543" y="84" width="76" height="44" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="555" y="106" fill="#f0f6fc" font-size="14" font-weight="600">M1 spin*</text><path d="M581,128 L581,170" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><text x="300" y="78" fill="#8b949e" font-size="11">* bare leads spliced to a spare 5-pack cable</text><rect x="300" y="170" width="320" height="214" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="312" y="192" fill="#f0f6fc" font-size="14" font-weight="600">SKR Pico V1.0 (grblHAL)</text><text x="312" y="212" fill="#8b949e" font-size="11.5">X · Y · Z1 · E   motor sockets (XH 4-pin)</text><text x="312" y="228" fill="#8b949e" font-size="11.5">X/Y/Z/E0-STOP  home switches (XH 3-pin)</text><text x="312" y="244" fill="#8b949e" font-size="11.5">HE (IO23)  lamp driver −Vin · M62 P4</text><text x="312" y="260" fill="#8b949e" font-size="11.5">HB (IO21)  reserved: colour bank BLOCKED</text><text x="312" y="276" fill="#8b949e" font-size="11.5">FAN1 (IO17)  optional fan</text><text x="312" y="292" fill="#8b949e" font-size="11.5">POWER  12/24 V screw terminal</text><text x="312" y="308" fill="#8b949e" font-size="11.5">USB-C  → laptop</text><path d="M139,308 L139,340 L300,340" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><text x="222" y="332" fill="#f85149" font-size="11" text-anchor="middle">motor power +</text><path d="M254,122 L276,122 L276,356 L300,356" fill="none" stroke="#8b949e" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="644" y="84" width="200" height="60" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="656" y="106" fill="#f0f6fc" font-size="14" font-weight="600">4 optical endstops</text><text x="656" y="126" fill="#8b949e" font-size="11.5">S · G · V → *-STOP pins 1 · 2 · 3</text><path d="M744,144 L744,158 L606,158 L606,170" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="660" y="190" width="212" height="60" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="672" y="212" fill="#f0f6fc" font-size="14" font-weight="600">Lamp driver NLDD-350HW</text><text x="672" y="232" fill="#8b949e" font-size="11.5">+Vin ← HE+ · −Vin → HE−</text><path d="M620,220 L660,220" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="660" y="276" width="212" height="44" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="672" y="298" fill="#f0f6fc" font-size="14" font-weight="600">COB lamp (06)</text><path d="M766,250 L766,276" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="900" y="84" width="280" height="60" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="912" y="106" fill="#f0f6fc" font-size="14" font-weight="600">Opto module PC817</text><text x="912" y="126" fill="#8b949e" font-size="11.5">24 V in → motor-power sense out</text><path d="M620,368 L886,368 L886,114 L900,114" fill="none" stroke="#f85149" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><text x="760" y="362" fill="#f85149" font-size="11" text-anchor="middle">MOT+ / MOT−</text><rect x="900" y="190" width="280" height="194" rx="9" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="912" y="212" fill="#f0f6fc" font-size="14" font-weight="600">ESP32-S3 hub (MicroPython)</text><text x="912" y="232" fill="#8b949e" font-size="11.5">J1-4…7  keypad A: HOME START STOP LIGHT</text><text x="912" y="248" fill="#8b949e" font-size="11.5">J1-8, 9  keypad B: NEXT, PAUSE</text><text x="912" y="264" fill="#8b949e" font-size="11.5">J1-10  opto OUT (motor-power sense)</text><text x="912" y="280" fill="#8b949e" font-size="11.5">J3-4, 5  I2C SDA, SCL (optional)</text><text x="912" y="296" fill="#8b949e" font-size="11.5">J3-16, 17  UART to the Pi (optional)</text><text x="912" y="312" fill="#8b949e" font-size="11.5">USB  → laptop</text><path d="M1040,144 L1040,190" fill="none" stroke="#bc8cff" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="1200" y="190" width="92" height="60" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="1212" y="212" fill="#f0f6fc" font-size="14" font-weight="600">Keypads</text><text x="1212" y="232" fill="#8b949e" font-size="11.5">2 × 1×4</text><path d="M1180,220 L1200,220" fill="none" stroke="#bc8cff" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><rect x="300" y="430" width="880" height="46" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="312" y="452" fill="#f0f6fc" font-size="14" font-weight="600">Laptop (Ubuntu / WSL): 3 USB ports</text><path d="M460,384 L460,430" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><text x="488" y="412" fill="#e3b341" font-size="11" text-anchor="middle">USB-C</text><path d="M1040,384 L1040,430" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path><text x="1060" y="412" fill="#e3b341" font-size="11" text-anchor="middle">USB</text><rect x="24" y="420" width="230" height="56" rx="9" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="36" y="442" fill="#f0f6fc" font-size="14" font-weight="600">Camera (06)</text><text x="36" y="462" fill="#8b949e" font-size="11.5">USB → laptop</text><path d="M254,448 L300,448" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-dasharray="8 5"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/></path>
</svg>
