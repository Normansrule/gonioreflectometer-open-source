eads…</text><rect x="514" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="199" fill="#8b949e" font-size="11" class="b">M52.2</text><text x="718" y="199" class="m" font-size="11" text-anchor="end">1 h</text><text x="524" y="219" class="t" font-size="13">AR session and alignment</text><line x1="504" x2="514" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="274" y2="274" stroke="#30363d" stroke-width="1"/><text x="24" y="300" class="t b" font-size="14">M53</text><text x="70" y="300" class="t" font-size="14">Platform comparison</text><text x="24" y="336" class="m" font-size="11">Measured tradeoffs between HoloLens 2</text><text x="24" y="351" class="m" font-size="11">and Meta Quest on the same content.</text><rect x="290" y="282" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="301" fill="#8b949e" font-size="11" class="b">M53.1</text><text x="494" y="301" class="m" font-size="11" text-anchor="end">3 h</text><text x="300" y="321" class="t" font-size="13">Technical measurements</text><rect x="514" y="282" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="301" fill="#8b949e" font-size="11" class="b">M53.2</text><text x="718" y="301" class="m" font-size="11" text-anchor="end">20 h</text><text x="524" y="321" class="t" font-size="13">User study</text><text x="524" y="335" class="m" font-size="10">+ ethics approval</text><line x1="504" x2="514" y1="311.0" y2="311.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="376" y2="376" stroke="#30363d" stroke-width="1"/><text x="24" y="402" class="t b" font-size="14">M54</text><text x="70" y="402" class="t" font-size="14">Graphics development</text><text x="24" y="438" class="m" font-size="11">The trainer shows measured data and</text><text x="24" y="453" class="m" font-size="11">renders the fitted material in the</text><rect 