<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600}</style>
<rect width="1200" height="490" rx="14" fill="#0d1117"/>
<text x="24" y="34" class="t b" font-size="18">15 · Standalone (no laptop)</text><text x="24" y="56" class="m" font-size="13">4 milestones · 9 steps · ~3.4 h hands-on · each chip is one GitHub issue</text><rect x="900" y="42" width="12" height="12" rx="3" fill="#3fb950"/><text x="918" y="53" class="m" font-size="12">done</text><rect x="990" y="42" width="12" height="12" rx="3" fill="#f0883e"/><text x="1008" y="53" class="m" font-size="12">next</text><rect x="1080" y="42" width="12" height="12" rx="3" fill="#30363d"/><text x="1098" y="53" class="m" font-size="12">to do</text><line x1="24" x2="1176" y1="70" y2="70" stroke="#30363d" stroke-width="1"/><text x="24" y="96" class="t b" font-size="14">M40</text><text x="70" y="96" class="t" font-size="14">Panel screen</text><text x="24" y="132" class="m" font-size="11">OLED shows menu and progress (both</text><text x="24" y="147" class="m" font-size="11">modes).</text><rect x="290" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="97" fill="#8b949e" font-size="11" class="b">M40.1</text><text x="494" y="97" class="m" font-size="11" text-anchor="end">15 min</text><text x="300" y="117" class="t" font-size="13">Order the kit</text><text x="300" y="131" class="m" font-size="10">+ shipping</text><rect x="514" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="97" fill="#8b949e" font-size="11" class="b">M40.2</text><text x="718" y="97" class="m" font-size="11" text-anchor="end">20 min</text><text x="524" y="117" class="t" font-size="13">OLED</text><line x1="504" x2="514" y1="107.0" y2="107.0" stroke="#30363d" stroke-width="2"/><rect x="738" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="748" y="97" fill="#8b949e" font-size="11" class="b">M40.3</text><text x="942" y="97" class="m" font-size="11" text-anchor="end">40 min</text><text x="748" y="117" class="t" font-size="13">Status screen (optional)</text><text x="748" y="131" class="m" font-size="10">+ print 2 h</text><line x1="728" x2="738" y1="107.0" y2="107.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="172" y2="172" stroke="#30363d" stroke-width="1"/><text x="24" y="198" class="t b" font-size="14">M41</text><text x="70" y="198" class="t" font-size="14">Pi Zero station set up</text><text x="24" y="234" class="m" font-size="11">Pi drives the SKR Pico over USB and</text><text x="24" y="249" class="m" font-size="11">grabs camera frames.</text><rect x="290" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="199" fill="#8b949e" font-size="11" class="b">M41.1</text><text x="494" y="199" class="m" font-size="11" text-anchor="end">20 min</text><text x="300" y="219" class="t" font-size="13">SD card</text><rect x="514" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="199" fill="#8b949e" font-size="11" class="b">M41.2</text><text x="718" y="199" class="m" font-size="11" text-anchor="end">45 min</text><text x="524" y="219" class="t" font-size="13">Buck and UART</text><line x1="504" x2="514" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><rect x="738" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="748" y="199" fill="#8b949e" font-size="11" class="b">M41.3</text><text x="942" y="199" class="m" font-size="11" text-anchor="end">20 min</text><text x="748" y="219" class="t" font-size="13">Install the station</text><line x1="728" x2="738" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="274" y2="274" stroke="#30363d" stroke-width="1"/><text x="24" y="300" class="t b" font-size="14">M42</text><text x="70" y="300" class="t" font-size="14">Job with no laptop</text><text x="24" y="336" class="m" font-size="11">Buttons choose and run a job; images</text><text x="24" y="351" class="m" font-size="11">saved on the Pi.</text><rect x="290" y="282" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="301" fill="#8b949e" font-size="11" class="b">M42.1</text><text x="494" y="301" class="m" font-size="11" text-anchor="end">20 min</text><text x="300" y="321" class="t" font-size="13">Mirror job</text><rect x="514" y="282" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="301" fill="#8b949e" font-size="11" class="b">M42.2</text><text x="718" y="301" class="m" font-size="11" text-anchor="end">10 min</text><text x="524" y="321" class="t" font-size="13">Stop and restart</text><line x1="504" x2="514" y1="311.0" y2="311.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="376" y2="376" stroke="#30363d" stroke-width="1"/><text x="24" y="402" class="t b" font-size="14">M43</text><text x="70" y="402" class="t" font-size="14">Laptop collects and verifies</text><text x="24" y="438" class="m" font-size="11">Laptop only pulls and checks data.</text><rect x="290" y="384" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="403" fill="#8b949e" font-size="11" class="b">M43.1</text><text x="494" y="403" class="m" font-size="11" text-anchor="end">15 min</text><text x="300" y="423" class="t" font-size="13">Pull and verify</text>
</svg>
