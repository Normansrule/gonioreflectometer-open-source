# Single source for stages and milestones. `python tools/roadmap.py` writes phases/*/README.md and the README;
# `--github --repo OWNER/NAME` makes one GitHub milestone per milestone and one issue per step (Do / Verify / Record).
# Edit freely, or use tools/new.py; then run `make`.
stages:
- folder: 00-plan
  title: Plan
  safety: 'ABS gives off fumes (styrene) while printing: enclosed printer, door shut, in a ventilated room you don''t sleep in; open the door only after it cools.'
- folder: 01-power
  title: Power
  safety: 'Only 24 V inside the machine: the wall adapter stays outside it. Before touching any screw terminal: press the e-stop and pull the adapter out of the wall. Wire everything with the adapter
    unplugged; it goes into the wall last.'
- folder: 02-controller
  title: Controller and buttons
  safety: Never plug or unplug motors with 24 V on.
- folder: 03-frame
  title: Frame
- folder: 04-light-arm
  title: Light arm (M4)
  safety: 'Before touching a motor plug or a screw terminal: press the e-stop and unplug the adapter.'
- folder: 05-table
  title: Table (M3)
  safety: 'Before touching a motor plug or a screw terminal: press the e-stop and unplug the adapter.'
- folder: 06-camera-light
  title: Camera and light
  safety: "Don't stare into the lamp. Before touching a motor plug or a screw terminal: press the e-stop and unplug the adapter."
- folder: 07-calibrate
  title: Calibrate → game material
- folder: 08-tilt
  title: Tilt (M2)
  safety: 'Before touching a motor plug or a screw terminal: press the e-stop and unplug the adapter.'
- folder: 09-spin
  title: Spin (M1)
  safety: 'Before touching a motor plug or a screw terminal: press the e-stop and unplug the adapter.'
- folder: 10-color
  title: Colour add-ons (optional)
- folder: 11-scan-capture
  title: '3D scan: capture'
- folder: 12-scan-mesh
  title: '3D scan: mesh'
- folder: 13-object-material
  title: Material on the 3D model
- folder: 14-laptop-app
  title: Laptop app
- folder: 15-standalone
  title: Standalone (no laptop)
- folder: 16-release
  title: Release
- folder: 17-upgrades
  title: Upgrades (optional)
milestones:
- id: M01
  stage: 00-plan
  title: Read and decide
  goal: Know what you are building, why, and what to buy.
  weeks: 1
  steps:
  - id: M01.1
    title: Get the papers
    time: 20 min
    needs:
    - laptop with Ubuntu (WSL)
    - browser
    do:
    - '`bash scripts/get_papers.sh`'
    - 'For each line under *Blocked for scripts*: open it in your browser, save the PDF to Downloads.'
    - '`bash scripts/get_papers.sh --from /mnt/c/Users/<you>/Downloads`'
    verify:
    - Second run prints only `have` / `took` lines and no *Blocked* list.
    - '`ls papers/open | grep R1` shows the R1 PDF.'
    fail:
    - '`took` missing for a file: the saved name differs; check `papers/papers.tsv` → `browser_name`.'
    - 'PDF opens as an HTML page: the publisher served a login page; download again from the article page.'
    record: Nothing to record. Tick the boxes; `make done id=M01.1`.
  - id: M01.2
    title: Read R1
    time: 2 h
    needs:
    - papers/open/R1_*.pdf
    do:
    - Read R1 sections 2 (device), 3 (calibration), 4 (results).
    - 'Close the paper. In `phases/00-plan/design.md` → Results, answer in one line each: (1) which axes turn the sample, (2) why the camera never moves, (3) what the mirror test calibrates, (4) why a 5°
      minimum light–camera angle.'
    verify:
    - Your four answers match README → *The machine* and *Theory and equations* (open them only now).
    fail:
    - 'An answer is wrong: re-read that part of R1 section 2 or 3 and correct the line.'
    record: The four answers in phases/00-plan/design.md → Results; commit.
  - id: M01.3
    title: Explore the simulator
    time: 30 min
    needs:
    - docs/lab.html in a browser
    do:
    - Open `docs/lab.html`. Drag to orbit; scroll to zoom; double-click to reset.
    - Press ▶ Demo. Drag *Build stage* from 1 to 17 and watch parts appear.
    - Set M4 = 60, M3 = 30. Then M4 = 60, M3 = 25.
    - 'Calibration lab: hidden table error +0.8°; press *Run calibrate mirror*; then drag *lamp drift* to 0.2 %.'
    verify:
    - M4 60 / M3 30 shows *Specular geometry ✓*; M3 25 does not.
    - 'Calibration lab: −0.80° WARN before, 0.00° PASS after calibrate; drift 0.2 % → FAIL.'
    - 'Without notes, sketch the machine: M1–M4, light, camera, zero point.'
    fail:
    - 'Page blank: open it with Chrome or Firefox (not a preview pane).'
    record: 'Optional: sketch photo as `phases/00-plan/sketch.jpg`. Tick the boxes; `make done id=M01.3`.'
  - id: M01.4
    title: Decide the parts
    time: 45 min
    needs:
    - '`PARTS.md` (on GitHub: open it → ✏️)'
    do:
    - Read each part's *why* line in `PARTS.md`.
    - 'Tick `[x]` the parts you agree with; `status: have` for ones you own; `status: swap` + `note:` for ones you want changed; `status: skip` for ones you won''t use.'
    - 'Tools: tick the TLS rows (00 · Plan) you will buy (they have their own total); `have` only for ones you really own. Optional kits: tick the SPC rows (spectral, +$17), MSK rows (colour bands + polarizers,
      +$30), CAM-04/05 (second camera: no camera moves, +$81), CAL-03 (chrome balls, +$10), ENC-01/03 (drape, only if M21.2 fails) and STA rows (standalone, +$38) only if you want them.'
    - Commit (*Commit changes* on GitHub, or `make publish m="M01.4 parts decided"` locally).
    verify:
    - Stages 01–03 headings in `PARTS.md` read `N/N decided` (nothing left `suggested`).
    - 'Summary table: *Still to buy* core ≤ the cap (`HARD_CAP` in `tools/bom_check.py`, $630); `make check` prints four `OK`.'
    fail:
    - 'A line stays `suggested` after ticking: the box must read `[x]` with no space inside.'
    - '`swap` parts: tell me the replacement, or add it with `python tools/new.py part …`, then `skip` the old one.'
    record: '`PARTS.md` committed. Tick the boxes; `make done id=M01.4`.'
- id: M02
  stage: 00-plan
  title: Software runs on the laptop
  goal: Tests, dry runs and the simulated machine work before any hardware.
  weeks: 1
  steps:
  - id: M02.1
    title: Install
    time: 20 min
    needs:
    - laptop
    - internet
    do:
    - 'In the repo folder: `make setup` (once).'
    - '`source .venv/bin/activate` (every new terminal).'
    - '`make all`'
    verify:
    - '`make all` ends with `passed` and no `failed`, after four `OK` lines from the check.'
    fail:
    - '`python3-venv` missing: `sudo apt install -y python3-venv`, then `make setup`.'
    - '`ERR` lines: each names a file; `make build` then `make check` again.'
    record: Tick the boxes; `make done id=M02.1`.
  - id: M02.2
    title: Dry run
    time: 10 min
    needs:
    - M02.1
    do:
    - '`opengonio check-pose M4=60 M3=30`'
    - '`opengonio --dry-run move M4=80 M3=25`'
    - '`opengonio check-pose M4=10 M3=0`'
    verify:
    - 'First: `"safe": true`, `theta_i` = `theta_r` = 30.0.'
    - 'Second prints `G53 G1 X60.0000 Y205.0000 F600` (grblHAL counts from each home switch: M4 80 − 20, M3 25 + 180).'
    - 'Third: `"safe": false` (light would hit the camera) and exit code 2.'
    fail:
    - '`command not found`: run `source .venv/bin/activate` first.'
    record: Tick the boxes; `make done id=M02.2`.
  - id: M02.3
    title: Simulated machine
    time: 20 min
    needs:
    - M02.1
    do:
    - '`make sim`'
    - '`opengonio --cal data/sim/try.yaml --sim mirror --sim-error M3=0.8 capture mirror --theta 30 --out data/sim/a`'
    - '`opengonio --cal data/sim/try.yaml verify data/sim/a`; `opengonio --cal data/sim/try.yaml curve data/sim/a`'
    - Open `data/sim/a/curve.svg` in a browser.
    - '`opengonio --cal data/sim/try.yaml calibrate mirror data/sim/a`'
    - Capture again with `--out data/sim/b` (same `--sim-error`), then verify `data/sim/b`.
    verify:
    - '`make sim` ends with `"result": "ALL PASS"`.'
    - 'First verify: `mirror_peak_error_deg` = −0.8, `result` WARN; the chart peak sits left of the orange line.'
    - 'Second verify: `mirror_peak_error_deg` within ±0.1, `result` PASS.'
    fail:
    - '`ALL PASS` missing: `data/sim/summary.json` → `checks` shows which one is false; run `make test`.'
    record: Nothing to commit (`data/sim/` is ignored). Tick the boxes; `make done id=M02.3`.
  - id: M02.4
    title: Practice a full measurement
    time: 30 min
    needs:
    - M02.3
    do:
    - '`C="--cal data/sim/p.yaml"; G="--sim-gamma 2.2"`'
    - '`opengonio $C --sim ptfe $G capture dark --out data/sim/dark && opengonio $C calibrate dark data/sim/dark`'
    - '`opengonio $C --sim ptfe $G capture linearity --out data/sim/lin && opengonio $C calibrate linearity data/sim/lin`'
    - '`opengonio $C --sim ptfe $G capture white --out data/sim/white && opengonio $C calibrate white data/sim/white`'
    - '`opengonio $C --sim plastic $G capture inplane --step 10 --out data/sim/plastic`'
    - '`opengonio $C curve data/sim/plastic && opengonio $C fit data/sim/plastic`; open `fit.svg`.'
    verify:
    - '`calibrate linearity` prints `gamma` 2.2 ± 0.1.'
    - '`fit` prints base_color 0.20 ± 0.02, roughness 0.30 ± 0.02, metallic ≤ 0.05 (the simulated plastic).'
    - In `fit.svg` the lines pass through the dots.
    fail:
    - '`brdf_per_sr` blank / fit error: a calibrate step was skipped; `opengonio $C calibrate show` lists what is missing.'
    record: This is exactly stage 07 on real hardware. Tick the boxes; `make done id=M02.4`.
- id: M03
  stage: 00-plan
  title: CAD and printer ready
  goal: Printed parts fit first time.
  weeks: 1
  steps:
  - id: M03.1
    title: Order the printer, filament and first tools
    time: 30 min
    wait: shipping 3–10 days
    needs:
    - '`PARTS.md` → 00 · Plan'
    do:
    - Order TLS-01 (enclosed printer for ABS), FIL-01 (black ABS, 4 × 1 kg), TLS-03 hex keys, TLS-06 calipers, plus FRM-06 (M2 screws) and FRM-08 (608 bearings) for the fit test; set them `ordered` with
      `paid:` in `PARTS.md`.
    - No printer? Skip TLS-01 and send the STL files to a print service or makerspace in black ABS; tell them the settings in M03.3.
    verify:
    - '`python tools/bom_check.py` shows the tools total; TLS-01, FIL-01, TLS-03, TLS-06, FRM-06, FRM-08 are `ordered`.'
    record: Commit the dated BOM.
  - id: M03.2
    title: Onshape document
    time: 30 min
    needs:
    - free Onshape account
    do:
    - Create document **OpenGonio**; add Variable Studio `OG globals` with the values in `phases/00-plan/design.md` → Onshape set-up.
    - Insert → Import `phases/00-plan/3d/PLAN-01_tolerance_coupon.step`.
    - 'Import `cad/assembly/opengonio_assembly.step` (whole machine, every part has a model; `cad/README.md` lists them). Real vendor models: `bash scripts/get_cad.sh` → `cad/vendor/`.'
    verify:
    - 'Coupon imports as one solid (Parts list: 1 part, not a mesh).'
    - The assembly opens with the printed deck, lazy Susan, arm, table and both cameras in place.
    fail:
    - 'Imported as a mesh: you picked the .stl; import the .step.'
    record: Onshape link under Onshape set-up in `phases/00-plan/design.md`; commit.
  - id: M03.3
    title: Print the coupon
    time: 15 min
    wait: print 1.5 h
    needs:
    - TLS-01 enclosed printer
    - FIL-01 black ABS
    - a ventilated room
    do:
    - 'Slice `phases/00-plan/3d/PLAN-01_tolerance_coupon.stl`: ABS, nozzle 250 °C, bed 100 °C, door closed, fan ≤ 20 %, 0.2 mm layers, 4 walls, 25 % infill, no supports.'
    - Print; let it cool in the closed printer for 10 min (ABS warps if cooled fast).
    verify:
    - 'Corners flat on the bed (no lifting); holes round; calipers: coupon length 100.0 ± 0.3 mm.'
    fail:
    - 'Short (ABS shrinks ~0.5–0.8 %): set the slicer''s XY shrinkage compensation to 100 × 100 / measured length %, reprint.'
    - 'Corners lift: clean the bed, add a 5 mm brim, keep the door shut.'
    - 'Bottom flare: elephant-foot compensation 0.2 mm.'
    record: Tick the boxes; `make done id=M03.3`.
  - id: M03.4
    title: Set clearances
    time: 30 min
    needs:
    - 5 × M2 × 10 from FRM-06
    - FRM-08 608 bearings (3)
    - TLS-03 hex key 1.5 mm
    - TLS-06 calipers
    do:
    - Drive one M2 × 10 into each of the 5 holes (1.5 → 1.9 mm) with the hex key, slowly, until the head touches; back it out.
    - Push a 608 into each of the 3 pockets by thumb.
    - Pick the smallest hole where the screw goes all the way without splitting the coupon and holds when you pull on it → `M2_TAP` = that hole Ø (every printed pilot in the machine uses it).
    - Pick the pocket where the 608 presses in and does not fall out upside down → `CLEAR` = pocket Ø − 22.0.
    - Set both at the top of `tools/cad/parts.py`.
    - 'Once: `.venv/bin/pip install cadquery numpy-stl matplotlib`; then `make parts`.'
    verify:
    - '`git status` lists changed `.step` / `.stl` files in `phases/*/3d/`.'
    - '`make check` prints four `OK`.'
    fail:
    - 'Every screw spins loose: print 10 °C hotter (better layer bonding) and reprint the coupon.'
    - '`make parts` import error: the cadquery install failed; re-run the pip line and read its last error.'
    record: 'Commit: `make publish m="M03.4 clearances set"`.'
- id: M04
  stage: 01-power
  title: Order and check power parts
  goal: Wall adapter, e-stop box, wire and lever connectors on the bench, each checked; the power plate printed.
  weeks: 2
  steps:
  - id: M04.1
    title: Order
    time: 20 min
    wait: shipping 3–10 days
    needs:
    - '`PARTS.md` → 01 · Power'
    - FRM-06 screws (03 · Frame)
    - '`PARTS.md` → 00 · Tools'
    do:
    - Order every stage-01 part ticked `[x]` (status `agreed`), using its link.
    - Also order LAR-06 (the limit switch, stage 04) now; it goes in the same + line in M14.1.
    - 'Tools: order the TLS rows (00 · Plan; their own total, not in the machine total): multimeter (TLS-05) and wire stripper (TLS-04) are needed now; the printer and ABS were ordered in M03.1.'
    - 'In `PARTS.md` set each ordered part to `status: ordered` and fill `paid:`.'
    verify:
    - Stage 01 in `PARTS.md` has no `agreed` or `suggested` parts left; *Paid so far* went up.
    - Tools TLS-02 to TLS-06 are `have` or `ordered`.
    fail:
    - 'Part out of stock: its *Must meet* line says what a substitute needs (adapter: regulated 24 V ≥ 3 A with short-circuit protection and a screw-terminal jack; e-stop: latching, NC rated for DC at ≥ 24 V / 3 A where the listing gives a DC rating); set `swap`
      + `note:`, or add one with `python tools/new.py part …`.'
    record: Commit the dated BOM.
  - id: M04.2
    title: Check parts
    time: 20 min
    needs:
    - PWR-30 adapter + jack
    - PWR-28 e-stop box
    - TLS-05 multimeter
    - calipers (TLS-06)
    do:
    - 'E-stop: take the box lid off. Meter on continuity: find the NC pair (beeps with the button released, opens when it is pressed). On the BAOMAIN this is terminals 1 and 2; 3 and 4 are NO.'
    - 'Adapter: round plug into the jack, nothing else on the jack. Plug the adapter into the wall. DC volts, red probe on the jack''s `+` screw, black on `−`. Unplug it again.'
    - Measure the jack (L × W × H) and the e-stop box (L × W). If either differs from `JACK` / `ESTOP_BOX` in `tools/cad/parts.py` by more than 1 mm, change it there and run `make parts` before printing.
    verify:
    - Adapter at the jack +23.0 to +25.0 V (a plus sign).
    - E-stop NC pair found and written on its box lid.
    - Jack and e-stop box within 1 mm of the CAD values (or the CAD updated).
    fail:
    - 'Reads about −24 V: the jack''s + / − marks are the other way round from the plug; use the screws as measured and mark them on the jack with a pen.'
    - 'Reads 0 V: adapter not in the wall or the plug not fully in the jack.'
    - 'Wrong part: return it now; don''t substitute ratings (adapter 24 V ≥ 3 A; e-stop and limit switch NC rated ≥ 3 A; neither listing gives a 24 V DC figure, so T5 and T6 are the check).'
    record: '`status: have` per part in `PARTS.md` as it arrives; measured sizes in design.md; commit.'
  - id: M04.3
    title: Print the power plate
    time: 10 min
    wait: print 1.5 h
    needs:
    - FIL-01 ABS
    - TLS-01 enclosed printer
    do:
    - 'Print `phases/01-power/3d/PWR-18_power_plate.stl` flat: ABS (settings from M03.3, brim on), 0.2 mm, 4 walls, 30 % infill.'
    verify:
    - The jack drops between its two frame walls without forcing; the e-stop box sits inside its rim.
    fail:
    - 'Too tight: scale the plate XY by +1 % in the slicer and reprint (no filing).'
    record: Tick the boxes; `make done id=M04.3`.
- id: M05
  stage: 01-power
  title: Wire the power
  goal: Jack and e-stop wired with screw terminals and lever connectors only; nothing soldered; adapter unplugged throughout.
  weeks: 1
  steps:
  - id: M05.1
    title: Plate hardware
    time: 15 min
    needs:
    - PWR-18 power plate
    - PWR-30 jack
    - PWR-28 e-stop box
    - TLS-09 double-sided tape
    do:
    - Jack into its frame on the plate, round socket toward the +X edge, screws toward the e-stop.
    - E-stop box into its rim on double-sided tape, button up. Lid off for wiring.
    verify:
    - 'Twisting each part by hand: nothing rotates or lifts.'
    - The adapter's round plug goes into the jack from the +X edge.
    record: Tick the boxes; `make done id=M05.1`.
  - id: M05.2
    title: Main wiring
    time: 30 min
    needs:
    - PWR-20 lever connectors (2 × 221-413)
    - PWR-15 18 AWG (1.5 m of each colour)
    - TLS-04 stripper
    - TLS-02 flat screwdriver
    - README → Wiring → 1, 2 (or `docs/wiring.html`)
    do:
    - Adapter **unplugged** from the wall, round plug in the jack. E-stop pressed.
    - 'Cut list (measure your own route along the deck edge first): red 10 cm (jack → NC 1) and one run NC 2 → tray (≈ 1 m); black one run jack → tray (≈ 1 m). Keep the rest: 10 cm offcuts for M08.3 and M10.3, 15 cm leads for the lamp (M18.1).'
    - 'Jack `+` → red wire → e-stop NC terminal 1. Strip 8 mm, twist, under either gap of the terminal screw, tighten, tug.'
    - 'E-stop NC terminal 2 → red wire (the whole run to the tray) → a 3-way lever connector: MOT+, slot 1. Mark it with tape. (M14.1 puts the limit switch in place of this wire.)'
    - 'Jack `−` → black wire (the whole run to the tray) → a second 3-way lever connector: MOT−, slot 1. Mark it.'
    - 'Tug every wire: none slips out. Lid back on the e-stop box.'
    verify:
    - 'Continuity: jack `+` to MOT+ beeps with the e-stop released; pressing the e-stop opens it.'
    - 'Continuity: jack `−` to MOT− beeps.'
    fail:
    - 'No beep through the e-stop: you used the NO contact; move the wires to the NC pair found in M04.2.'
    - 'Wire pulls out: strip longer (11 mm in lever connectors), twist, re-close the lever.'
    record: Tick each row of README → Wiring → 1. Tick the boxes; `make done id=M05.2`.
  - id: M05.3
    title: Checks with power off
    time: 5 min
    needs:
    - TLS-05 multimeter
    - adapter unplugged
    - e-stop released
    do:
    - 'Ω range: MOT+ to MOT− (T1), both probe directions.'
    verify:
    - T1 > 10 kΩ (or OL) both ways.
    fail:
    - 'T1 low: a stray strand bridges + and − at the jack or the e-stop terminals; re-strip and re-tighten.'
    record: T1 in `phases/01-power/test.csv` (date, value, PASS/FAIL).
- id: M06
  stage: 01-power
  title: First power-on
  goal: 24 V at MOT+ / MOT− with the right polarity, cut by the e-stop.
  weeks: 1
  steps:
  - id: M06.1
    title: Voltage and polarity
    time: 10 min
    needs:
    - PWR-30 adapter
    - TLS-05 multimeter
    - MOT+ / MOT− connectors free (no motor board)
    do:
    - E-stop pressed. Adapter into the wall.
    - 'Release the e-stop. DC V: black probe in a free slot of MOT−, red probe in a free slot of MOT+ (T3).'
    verify:
    - 'T3 = +23.0 to +25.0 V (a plus sign: polarity right).'
    - Nothing warm after 1 min.
    fail:
    - 'Reads negative: + and − swapped at the jack; unplug the adapter, then swap the two wires there.'
    - 'Reads 0 V: e-stop still pressed, wired to NO, or the plug not in the jack.'
    record: T3 in `test.csv`.
  - id: M06.2
    title: E-stop and heat
    time: 40 min
    wait: 30 min on, watched
    needs:
    - TLS-05 multimeter + temperature probe
    - 'optional: the SKR Pico with one motor holding, from M08'
    do:
    - Press the e-stop; read MOT+ to MOT− after 1 s (T5). Release.
    - 30 min on (with the SKR Pico + one motor holding if you have them); then the temperature of the adapter case and each terminal (T9).
    - Press the e-stop; pull the adapter out of the wall.
    verify:
    - T5 < 1 V within 1 s.
    - T9 every point ≤ 45 °C.
    fail:
    - 'Stays at 24 V on e-stop: NC / NO swapped, or a wire bypasses the e-stop.'
    - 'A terminal hot: loose screw or a few strands only; unplug, re-strip, re-tighten.'
    record: T5, T9 in `test.csv`; label the plate *24 V · press the e-stop and unplug before touching a terminal*; commit.
- id: M07
  stage: 02-controller
  title: Order controller parts
  goal: SKR Pico, keypads, cables, the motor 5-pack and the endstops on the bench; your ESP32-S3 as the hub.
  weeks: 2
  steps:
  - id: M07.1
    title: Order
    time: 30 min
    wait: shipping 3–10 days
    needs:
    - '`PARTS.md` → 02 · Controller and buttons'
    do:
    - 'Order every stage-02 part ticked `[x]` (all on Amazon). CTL-02 is your own ESP32-S3: already `have`.'
    - Also order LAR-02 (the 17HS4401 5-pack) and LAR-05 (the endstop 6-pack) from stage 04 for the bench tests.
    - 'Set them `status: ordered` with `paid:` in `PARTS.md`.'
    verify:
    - Stage 02 has no `agreed` or `suggested` parts left.
    fail:
    - 'SKR Pico sold out: its *Must meet* line names what a replacement needs (grblHAL board map, 4 × TMC2209 UART, USB-C); a FluidNC ESP32 board also works with `controller.firmware: fluidnc` and `firmware/fluidnc/config.yaml`.'
    record: Commit the dated BOM.
  - id: M07.2
    title: Unpack and check
    time: 15 min
    needs:
    - CTL parts
    - PWR-10 opto module
    - TLS-06 calipers
    do:
    - 'SKR Pico: BOOT jumper cap in the box (or on the board). ESP32-S3: pins soldered, two USB-C connectors (USB, UART). Keypads: 5-wire tails intact. Jumpers: male–female.'
    - Measure the ESP32-S3 board (L × W). If it differs from `ESP` in `tools/cad/parts.py` by > 1 mm, change it and `make parts` before printing the tray.
    - 'Find each keypad''s common pin: meter on continuity, one probe on a tail pin, press keys; the common pin beeps with every key.'
    verify:
    - Common pin found on both keypads (write it on the tail with a marker).
    - ESP32-S3 size within 1 mm of the CAD (or the CAD updated).
    fail:
    - 'No pin beeps with all keys: tail not fully seated in the meter probe; use a jumper''s male end as a probe tip.'
    - 'No BOOT jumper cap: any 2.54 mm jumper cap; or hold a female–female jumper across the two BOOT pins while pressing RESET.'
    record: '`status: have` per arrived part in `PARTS.md`; commit.'
- id: M08
  stage: 02-controller
  title: One motor turns from the laptop
  goal: Laptop → USB-C → SKR Pico (grblHAL) → motor works on the bench.
  weeks: 1
  steps:
  - id: M08.1
    title: USB-C into Ubuntu
    time: 15 min
    needs:
    - CTL-01 SKR Pico
    - CTL-03 USB-C cable
    - Windows PowerShell (admin)
    do:
    - 'Plug the SKR Pico into the laptop by USB-C (no motor power needed: its schematic feeds USB 5 V into the logic supply through a diode; if no LED lights, check the USB-C cable carries data; the board gets motor power only in M08.3).'
    - 'PowerShell (admin): `usbipd list` (the board shows as 2e8a:…); `usbipd bind --busid <busid>`; `usbipd attach --wsl --busid <busid>`.'
    - 'Ubuntu: `sudo usermod -aG dialout $USER && newgrp dialout`; `ls /dev/ttyACM*`.'
    verify:
    - The board is listed (as RP2 Boot or a serial port).
    fail:
    - 'Not listed in `usbipd list`: charge-only cable; swap it.'
    - 'Vanishes after replug or flashing: run `usbipd attach` again (needed after every re-enumeration).'
    record: Tick the boxes; `make done id=M08.1`.
  - id: M08.2
    title: Flash grblHAL
    time: 25 min
    needs:
    - M08.1
    - BOOT jumper cap
    do:
    - '`bash scripts/controller.sh flash` and follow its four steps: build the .uf2 in the grblHAL Web Builder (board BTT SKR Pico 1.0, 4 axes), BOOT jumper on, RESET, copy the .uf2 onto `RPI-RP2`, jumper
      off, RESET.'
    - '`bash scripts/controller.sh settings` (sends `firmware/grblhal/settings.txt`, then prints `$$`).'
    - '`bash scripts/controller.sh pins`: note the port numbers of HE, HB and FAN1; set `lights.white.output` (HE) and `lights.multispectral.output` (HB) in `software/config/machine.yaml` if they differ
      from 4 and 3.'
    verify:
    - '`opengonio send ''$I''` lists grblHAL and `BTT SKR Pico 1.0`.'
    - '`opengonio send ''?''` prints a line starting `<Alarm|MPos:` (homing required) or `<Idle|MPos:`.'
    - '`$$` shows `$22=15` and `$10=17`.'
    fail:
    - '`error:` on a settings line: that number doesn''t exist in your build (an option was left out in the Web Builder); rebuild with 4 axes and the Trinamic driver, or remove the line and note it in design.md.'
    - 'No `RPI-RP2` drive: BOOT jumper not on the right pins, or RESET not pressed after fitting it.'
    record: C1 in `phases/02-controller/test.csv`.
  - id: M08.3
    title: Bench motor
    time: 20 min
    needs:
    - LAR-02 motor
    - power wired (M05)
    - 2 × 10 cm PWR-15 offcuts (red, black)
    - tape flag on the shaft
    do:
    - 'E-stop pressed, adapter unplugged. 10 cm red offcut from MOT+ slot 3 → SKR Pico POWER `+`, 10 cm black from MOT− slot 3 → POWER `−` (screw terminal). Motor → the X socket. Adapter in, release the e-stop.'
    - '`opengonio send ''M122 I''` (drivers configured now that motor power is on).'
    - '`opengonio send ''$20=0'' ''$X'' ''G91'' ''G1 X10 F600'' ''G1 X-10 F600'' ''G90''` (soft limits off and `$X` unlock: unhomed bench test only).'
    - '`opengonio send ''$X'' ''G91'' ''G1 X360 F300'' ''G90''`; press the e-stop halfway.'
    - '`opengonio send ''$20=1''` (soft limits back on).'
    verify:
    - Shaft turns, then returns to the tape mark.
    - E-stop stops it at once; after release `opengonio send '?'` shows `Alarm` or a lost position (must re-home).
    fail:
    - 'Motor buzzes, no turn: coil pairs crossed. The SKR Pico drives one coil on plug pins 1 + 4 (2B, 2A) and the other on pins 2 + 3 (1B, 1A) (maker schematic). Motor plugged in, meter on Ω at the 4-pin
      plug''s back: 1–4 and 2–3 must each read a few ohms. If not, lift contact latches with a pin and move contacts until they do.'
    - 'Wrong direction: `opengonio send ''$3=1''` (direction invert mask: X 1, Y 2, Z 4, A 8) and add `$3` to `tools/grblhal_settings.py`.'
    - '`error:` on G1: the board is still locked or soft limits are on; `$20=0` and `$X` must come first in the same send line.'
    record: Note the result under C7 in `test.csv`.
- id: M09
  stage: 02-controller
  title: Keypads work with the laptop
  goal: Membrane keys on the ESP32-S3 hub drive the machine.
  weeks: 1
  steps:
  - id: M09.1
    title: Hub firmware
    time: 15 min
    needs:
    - CTL-02 ESP32-S3
    - CTL-03 USB-C cable
    do:
    - 'Plug the ESP32-S3''s **USB** connector (not UART) into the laptop; WSL: `usbipd attach` it too (303a:…).'
    - 'Read the module can: N8R8 / N16R8 → `bash scripts/hub.sh flash oct`; otherwise `bash scripts/hub.sh flash plain`.'
    - Press RST, then `bash scripts/hub.sh`.
    verify:
    - '`hub.sh` prints `PONG OpenGonio-hub 4`.'
    fail:
    - 'Flash can''t connect: hold BOOT, tap RST, release BOOT (download mode), run it again.'
    - '`mpremote` can''t find it: `ls /dev/ttyACM*` empty → attach with usbipd again.'
    record: C4 (PING part) in `test.csv`.
  - id: M09.2
    title: Wire the keypads
    time: 30 min
    needs:
    - 2 × CTL-05 keypads
    - CTL-07 jumpers
    - 1 × WAGO 221-413 (PWR-20)
    - README → Wiring → 6
    do:
    - 'Keypad A: male jumper ends into its tail; keys 1–4 → header J1-4 (GPIO 4) HOME, J1-5 (5) START, J1-6 (6) STOP, J1-7 (7) LIGHT.'
    - 'Keypad B: key 1 → J1-8 (GPIO 15) NEXT; key 2 → J1-9 (GPIO 16) PAUSE.'
    - 'Both commons: cut the female end off each common jumper, strip 11 mm, fold double, into a 3-way lever connector; a third jumper (male end cut, stripped, folded) from it to J1-22 (GND).'
    - '`python -m serial.tools.miniterm /dev/ttyACM1 115200` (the hub''s port), press each key.'
    verify:
    - Each press prints its own `BTN <NAME>` exactly once.
    fail:
    - 'Nothing on any key: common on a key pin; redo M07.2.'
    - 'Two lines per press: the firmware debounces 30 ms — reseat the jumper on that pin.'
    record: C4 in `test.csv`.
  - id: M09.3
    title: Panel drives the motor
    time: 20 min
    needs:
    - bench motor on X
    do:
    - '`opengonio panel`'
    - Press HOME, LIGHT, NEXT, START, PAUSE, START, then STOP.
    verify:
    - Each press prints its action in the panel log.
    - PAUSE stops the plan after the pose in progress; START carries on from the next pose.
    fail:
    - 'A key does nothing: wrong GPIO; check the pin table.'
    record: C5, C6 in `test.csv`.
- id: M10
  stage: 02-controller
  title: Controller box closed
  goal: Boards on the tray; homing, e-stop sense and heat tested.
  weeks: 1
  steps:
  - id: M10.1
    title: Print and mount
    time: 30 min
    wait: print 4 h
    needs:
    - CTL-10 prints
    - 4 × M2 × 8 + washers
    - PWR-10 opto module
    - TLS-09 double-sided foam tape
    do:
    - 'Measure the ESP32-S3 board first: the tray''s frame fits Espressif''s 62.7 × 25.4 mm board. A clone that is longer (up to ~69 × 26): set `ESP` in `tools/cad/parts.py`, `make parts`. Then print `CTL-10a_button_panel.stl`, `CTL-10b_controller_tray.stl`.'
    - Drive M2 × 8 into the 4 SKR Pico standoffs once; mount the board (holes 58 × 49 mm), USB-C toward the tray edge, a washer under each head.
    - 'ESP32-S3 (flashed in M09.1): a square of foam tape on the pedestal, then the board upside down (module can on the tape, header pins up), USB end at the opening.'
    - 'Opto module (PWR-10) into the long frame, double-sided tape under it, terminals up. The short frame is for the LED driver (M18.1). Keypads: peel and stick into the panel recesses, tails through the
      slots.'
    - 'Lever connectors: MOT+ and MOT− (from M05.2) and a third 221-413 for the keypad GND (M09) slide into the pockets along the tray''s south edge, wire openings out, levers up. The fourth pocket is spare.'
    verify:
    - SKR Pico sits flat on all four standoffs; its USB-C is reachable.
    - The ESP32-S3 doesn't lift when you unplug a jumper; its USB connector takes a plug.
    fail:
    - 'Holes off: measure your board''s hole spacing, set `SKR_HOLES` in `tools/cad/parts.py` (CTL-10b), `make parts`, reprint.'
    - 'Module doesn''t fit its frame: measure it, set `OPTO_MOD` / `LED_DRV` / `ESP` in `tools/cad/parts.py`, `make parts`, reprint the tray.'
    record: Tick the boxes; `make done id=M10.1`.
  - id: M10.2
    title: Flags and homing
    time: 30 min
    needs:
    - LAR-05 endstop
    - 'CTL-06: 3 double-ended XH leads + two 3-pin housings'
    - a card to block it
    do:
    - 'Endstop lead: 3 CTL-06 leads. Board end: one 3-pin XH housing, pin 1 signal, 2 GND, 3 5 V (SKR Pico pin diagram) into X-STOP. Module end: each wire onto the module pin with the matching printed label
      (S/OUT, G/GND, V/VCC; its pin order may differ: use single housings or a 3-pin housing in that order). Meter the module''s V pin to STOP pin 3 before plugging in.'
    - '`opengonio send ''?''` with the slot open, then blocked.'
    - 'Motor on X, endstop flag taped to the shaft: `opengonio send ''$HX''`.'
    verify:
    - Blocked shows `Pn:X`; open shows no `Pn`.
    - '`$HX` turns until the flag cuts the slot and stops; `?` shows MPos X = 0 (`opengonio status` reports M4 = 20).'
    fail:
    - 'Never stops / `Pn:X` while open: inverted input; `opengonio send ''$5=1''` (X bit) and add `$5` to `tools/grblhal_settings.py`.'
    - 'Module LED never lights: lead on the wrong module pins. Match each wire to the module''s printed label (S/OUT, G/GND, V/VCC); meter the module''s V pin to STOP pin 3 (5 V) before plugging in.'
    record: C2, C3 in `test.csv`.
  - id: M10.3
    title: E-stop sense with the opto module
    time: 30 min
    needs:
    - PWR-10 opto module (24 V version)
    - 2 × short PWR-15 offcuts (red, black)
    - M-F jumpers
    do:
    - 'E-stop pressed, adapter unplugged. Short red offcut from MOT+ slot 2 → the opto module''s IN+ screw; short black from MOT− slot 2 → IN−. 8 mm under the module screws, 11 mm in the lever connectors.'
    - 'Output side: module VCC ← ESP32-S3 J1-1 (3V3), GND ← J3-21 (GND), OUT → J1-10 (GPIO 17) (female jumper ends on the hub pins; bare ends under the module screws, or female ends on its pins).'
    - 'Motor holding (`opengonio home`, then wait): measure SKR Pico POWER (T4), and DC volts from jack `+` to SKR Pico POWER `+` (T12, the drop along the wires and switches). Press the e-stop: watch the hub output and the panel; release; `opengonio home`.'
    verify:
    - T4 ≥ 22.5 V; T12 ≤ 0.3 V.
    - Module input LED on with motor power on; hub prints `POWER 0` on e-stop, `POWER 1` after release, 20 times out of 20 (T7); moves refused until HOME (C7).
    fail:
    - 'Reads the wrong way round (`POWER 1` with the e-stop pressed): your module drives OUT high when powered; set `SENSE_ACTIVE_LOW = False` in `firmware/hub/main.py`, `bash scripts/hub.sh`.'
    - 'Never changes: input `+` / `−` swapped, or OUT not on GPIO 17; the module''s input LED must light with motor power on.'
    record: T4, T7, T12 in `phases/01-power/test.csv`; C7 in `phases/02-controller/test.csv`.
  - id: M10.4
    title: Heat
    time: 10 min
    wait: 30 min hold
    needs:
    - TLS-05 temperature probe
    do:
    - '`opengonio home`, motor holding at 0.8 A run current for 30 min, lid on; probe on the SKR Pico driver heatsink.'
    verify:
    - Driver area ≤ 80 °C (C8).
    fail:
    - 'Hotter: fit the optional CTL-08 fan on FAN1 (`M62 P2`; BTT advise a fan above 0.8 A), or lower `$140` to 700 mA.'
    record: C8 in `test.csv`; commit `make publish m="M10 controller done"`.
- id: M11
  stage: 03-frame
  title: Print and join the deck
  goal: Nine printed tiles bolted into one 600 mm deck; every mount already has its pilot hole.
  weeks: 1
  steps:
  - id: M11.1
    title: Order frame parts
    time: 20 min
    wait: shipping
    needs:
    - '`PARTS.md` → 03 · Frame'
    do:
    - Order every stage-03 part ticked `[x]`; set them `ordered` with `paid:`.
    verify:
    - Stage 03 has no `agreed` or `suggested` parts left.
    record: Commit `PARTS.md`.
  - id: M11.2
    title: Print the deck tiles
    time: 30 min
    wait: print ≈ 55 h (9 × 6 h)
    needs:
    - FIL-01 ABS (1.5 kg of it)
    - TLS-01 enclosed printer
    do:
    - 'Print the 9 tiles `FRM-01a_deck_tile_SW.stl` … `FRM-01i_deck_tile_NE.stl` as exported: top face on the bed, no supports, 5 mm brim, door shut until cool.'
    - 'Write each tile''s name (SW … NE) on its underside as it comes off. Map: `phases/03-frame/design.md`.'
    verify:
    - 'Each tile lies flat on the table: a sheet of paper won''t slide under any corner.'
    - 'Calipers: every edge 200.0 ± 0.4 mm.'
    fail:
    - 'Corner lifts: 8 mm brim, bed 105 °C, door shut until below 40 °C; reprint.'
    - 'Edges short: XY shrink compensation from M03.3 not set; reprint.'
    record: Tick the boxes; `make done id=M11.2`.
  - id: M11.3
    title: Bolt the deck together
    time: 45 min
    needs:
    - 9 deck tiles
    - 36 × M2 × 10 + nuts + washers (FRM-06)
    - TLS-03 hex key 1.5 mm
    - a flat table
    do:
    - 'Tiles upside down (top face on the table, ribs up), in their places as seen from below: east and west swap, so E tiles lie on your left when N points away.'
    - Butt neighbouring walls; M2 × 10 through each pair of seam holes (3 per edge), washer and nut on the other side. Finger-tight everywhere first, then tighten from the centre tile outward.
    - Turn the deck over, onto the table where it will live (+X, east, toward where the camera goes; leave 450 mm free beyond that edge for the outrigger).
    verify:
    - 'A straight edge across every seam: no step > 0.3 mm.'
    - 'Lift one corner 10 mm: the deck moves as one piece, no seam opens.'
    fail:
    - 'Step at a seam: loosen its 3 bolts, press both skins flat on the table, tighten again.'
    record: Photo `phases/03-frame/deck.jpg`; commit.
- id: M12
  stage: 03-frame
  title: Assemble the frame
  goal: Outrigger, camera pillar, scan post and boxes screwed into the deck's pilots.
  weeks: 1
  steps:
  - id: M12.1
    title: Outrigger, camera pillar and scan post
    time: 1 h
    wait: print 8 h
    needs:
    - FRM-02a–d bars
    - 2 × FRM-09d saddles
    - 2 × FRM-09i couplers
    - FRM-09e post socket
    - FRM-09h camera pillar
    - FRM-09f end foot
    - 8 × M2 × 12 and 14 × M2 × 16 (FRM-06)
    - TLS-07 phone level app
    do:
    - Print the bars `FRM-02a…d` (lying flat, as exported), 2 × `FRM-09d_bar_saddle.stl`, 2 × `FRM-09i_bar_coupler.stl` (standing), `FRM-09e_post_socket.stl`, `FRM-09f_end_foot.stl`, `FRM-09h_camera_pillar.stl`.
    - 'Saddles on their pilots in the east tile (x = 237 and 278, on the +X line): 4 × M2 × 12 each.'
    - 'Outrigger: bars 1 and 2 butted inside a coupler, M2 × 16 through the coupler into each bar''s pilots. Lay it in the saddles, inner end at x = 215, the far end on the end foot (standing on the table
      at x = 628). Every clamp''s hole now lines up with a pilot in the bar: M2 × 16 through each saddle cheek and the end foot.'
    - 'Camera pillar (FRM-09h) over the outrigger at its pilot (x = 391.8); post socket over the pilot at x = 674.4, M2 × 16 each. Scan post: bar 1 into the socket (M2 × 16), bar 2 on top through the second
      coupler. No tall post at the measuring camera: it would stand in the scan camera''s view.'
    verify:
    - 'Posts vertical: phone level app on two faces reads 90.0 ± 0.5°.'
    - Every screw found its pilot (none driven into plain plastic).
    - Pillar and post centres 391.8 ± 1 and 674.4 ± 2 mm from the deck centre (tape); pillar's camera pilot at 150 ± 1 mm above the deck.
    - Outrigger level end to end (phone level app ±0.5°).
    fail:
    - 'A screw misses its pilot by > 1 mm: that bar shrank; check the XY compensation (M03.3) and reprint it.'
    - 'Far end low: the end foot is 30 mm for the 24 mm deck + 6 mm saddle floor; shim it.'
    record: Tick the boxes; `make done id=M12.1`.
  - id: M12.2
    title: Mount the plate and tray
    time: 15 min
    needs:
    - power plate (with jack and e-stop box)
    - controller tray
    - 8 × M2 × 12 (FRM-06)
    do:
    - 'Power plate: 4 × M2 × 12 through its counterbored holes into the SE tile''s pilots (centre 220, −220), jack socket toward the +X edge. Lift the e-stop box off its tape to reach the two holes under it, then press it back.'
    - 'Controller tray: 4 × M2 × 12 through its corner bosses into the NW tile''s pilots (centre −200, 220).'
    - Red and black runs along the deck edge to MOT+ / MOT− on the tray; take the red run up the +X side, past the ring at about 17° (the limit switch is spliced into it there in M14.1), and leave 10 cm of slack there.
    verify:
    - '`opengonio status` still answers; e-stop still cuts (repeat T5).'
    record: Photo `phases/03-frame/frame.jpg`; commit.
- id: M13
  stage: 04-light-arm
  title: Ring drive built
  goal: Light arm turns smoothly on the ring.
  weeks: 1
  steps:
  - id: M13.1
    title: Measure and set the rim
    time: 30 min
    needs:
    - LAR-01 lazy Susan
    - calipers
    do:
    - Order the stage-04 parts ticked in `PARTS.md` (if not done); mark them `ordered`.
    - Measure the lazy Susan top-plate outer Ø and its 4 hole positions.
    - Set `RIM_TEETH` in `tools/cad/parts.py` so `RIM_R` ≈ plate radius − 5 mm; `python tools/cad/parts.py --only LAR-08a`.
    verify:
    - Printed `RIM_R` within 5 ± 1 mm of the plate edge.
    - '`gear_ratio` = `RIM_TEETH` / 20 noted.'
    record: Plate Ø, `RIM_TEETH`, `gear_ratio` in phases/04-light-arm/design.md → Results.
  - id: M13.2
    title: Print ring parts
    time: 15 min
    wait: print 9 h
    needs:
    - FIL-01 ABS
    do:
    - Print 7 × `LAR-08a_rim_segment.stl`, 1 × `LAR-08c_arm_segment.stl` (the 8th rim segment, with the upright socket), 1 × `LAR-08b_ring_motor_mount.stl`, 1 × `LAR-08e_cross_clamp.stl`, `LAR-08f_upright_bar.stl`
      and `LAR-08g_arm_bar.stl` (lying flat), 4 × `FRM-09c_protractor_segment.stl` (ring scale + lazy-Susan clamp, 80° each).
    verify:
    - Segments butt into a closed ring on the table (no gap > 0.5 mm).
    record: Tick the boxes; `make done id=M13.2`.
  - id: M13.3
    title: Lazy Susan, rim and belt
    time: 1.25 h
    needs:
    - LAR-01 lazy Susan
    - LAR-03 belt
    - 4 × FRM-09c ring-scale clamps
    - 8 × M2 × 10 + washers
    - M2 × 12 + nuts + the 2 wide printed washers (TBL-07f)
    - TLS-09 CA glue
    - TLS-04 cutter
    do:
    - 'Lazy Susan on the deck centre, its bottom plate inside the ring of 8 pilot holes (r 163). Ring-scale segments end to end from 20° to 340° (0° = +X, toward the camera; the gap is the M4 motor): each
      inner wall against the bottom plate''s edge, its lip over the plate; 2 × M2 × 10 + washer into the deck pilots. The lazy Susan needs no screws of its own.'
    - 'Rim segments + the arm segment on the top plate, closed ring: turn the ring so an arm-segment slot lands on a plate hole; M2 × 12 + wide printed washer + nut through every slot that lands on a hole;
      CA-glue the rest (the arm segment''s whole underside).'
    - CA-glue the GT2 belt teeth-out on the 6 mm band, its edges flush with the band's edges, ends butted, no gap; it ties the segments together.
    verify:
    - 'Count the belt teeth: equals `RIM_TEETH` ± 1.'
    - No tooth step at the joint (run a fingernail over it).
    - Bottom plate can't slide or lift (push hard sideways).
    - The 20° and 340° scale ends sit symmetric about the line deck centre → camera pillar (string line).
    fail:
    - 'Gap at the joint: cut a 1-tooth filler from spare belt.'
    record: Tooth count in design.md.
  - id: M13.4
    title: Motor
    time: 30 min
    needs:
    - LAR-02 motor
    - LAR-04 20T pulley
    - LAR-08b mount
    - 4 × M3 × 8 (FRM-07)
    - 2 × M2 × 12 + washers
    do:
    - 'E-stop pressed. This is the bench motor from M08.3: unplug it from the SKR Pico X socket only now, mount it, then plug it back into X with its cable along the deck edge.'
    - Motor on the mount plate (shaft down through the slot, 4 × M3 × 8); 20T pulley on the shaft, grub on the D flat, teeth level with the rim belt (its flanges pass above and below the band).
    - Mount at 0° (+X), base outside the lazy Susan, its two slots over the two deck pilots; slide it in until the pulley meshes the rim belt fully, then M2 × 12 + washer through each slot.
    verify:
    - Pulley teeth engage the rim belt across its full width; turning the ring by hand turns the motor, no skipped tooth.
    fail:
    - 'Skips under a light push: slide the mount 0.5 mm inward and re-tighten.'
    record: Tick the boxes; `make done id=M13.4`.
  - id: M13.5
    title: Arm
    time: 45 min
    needs:
    - LAR-08c arm segment (in the ring)
    - LAR-08f upright + LAR-08g arm bars
    - LAR-08e cross clamp
    - 3 × M2 × 16
    - LSR-05 lamp body (stage 06, or a dummy)
    do:
    - The upright stands in the arm segment's socket, 36 mm beside the lamp's beam line (so it never shades the sample).
    - Upright bar in the socket, M2 × 16 through the socket wall into its lower pilot. Cross clamp down the upright until its screw meets the upper pilot (M2 × 16). Arm bar through the clamp's side channel,
      parallel to the beam line, pointing outward, its inner pilot under the clamp's top screw (M2 × 16). The lamp's clamp takes the outer pilot (M18.1), so the beam centre passes through the zero point,
      300 mm out, at 150 mm.
    verify:
    - 'Turning by hand 20 → 324°: no tight spot, no skipped tooth; the arm segment and upright never touch the motor plate.'
    - 'Lamp position: 300 ± 2 mm from the zero point, height 150 ± 2 mm.'
    record: Commit.
- id: M14
  stage: 04-light-arm
  title: Light arm homes and repeats
  goal: M4 returns to the same spot every time (≤ 0.1°).
  weeks: 1
  steps:
  - id: M14.1
    title: Home switch
    time: 45 min
    needs:
    - LAR-05 TCST2103
    - LAR-06 limit switch (3 wires attached)
    - 3 × 221-2401 (PWR-20; two splices + the blue cap)
    - flag on the arm
    do:
    - 'Mount the TCST2103 so the arm flag cuts it at 20°: M2 × 8 + washer through one module hole into the nearest spare deck pilot (40 mm grid), double-sided tape under it (lead as in M10.2).'
    - 'Limit switch (LAR-06) on the deck at 17° (3° past home, outside the 20–324° travel), lever toward the arm (double-sided tape). Find its wires with the meter: COM–NC beeps with the lever untouched and opens when pressed (black = COM, grey = NC, blue = NO on the units bought).'
    - 'Press the e-stop, unplug the adapter. Splice the switch into the red run (e-stop NC 2 → MOT+ slot 1), so the length of its own leads doesn''t matter: lay the run past the switch and cut it where both the black and the grey lead reach it with slack. Strip 11 mm on both cut ends and on the black and grey leads.'
    - 'One 221-2401: red from the e-stop + black (COM). A second: grey (NC) + red on to the tray. Blue (NO) alone in the third. Tug each; tape the connectors to the deck beside the switch.'
    - 'Check before power (adapter unplugged, e-stop released): continuity e-stop NC 2 → MOT+ beeps; press the lever: it opens (proves the switch is in the + line). Ω MOT+ to MOT−: > 10 kΩ or OL (T1).'
    - Adapter in, release the e-stop.
    verify:
    - '`opengonio send ''?''` shows `Pn:X` with the flag in the slot.'
    - Pressing the lever drops SKR Pico POWER to 0 V and the hub prints `POWER 0`; releasing it brings both back (T6).
    record: T6 in `phases/01-power/test.csv`; `make done id=M14.1`.
  - id: M14.2
    title: Config and homing
    time: 20 min
    needs:
    - '`software/config/machine.yaml`'
    do:
    - 'Set `installed_phase: 4` and `M4.gear_ratio` (from M13.1).'
    - '`make test`'
    - 'Power-cycle the SKR Pico (e-stop, then USB): `opengonio send ''?''`.'
    - '`opengonio home` ten times.'
    verify:
    - Tests pass.
    - 'After power-up `?` shows `<Alarm` (must_home: nothing moves until homed); after homing `<Idle`.'
    - Home finishes 10/10; arm stops on the flag, never on the limit switch.
    fail:
    - 'Homes the wrong way: clear the X bit of `$23` (homing direction mask) in `tools/grblhal_settings.py`, `make build`, `bash scripts/controller.sh settings`.'
    - 'Still `<Alarm` after homing the installed axes: your grblHAL build keeps the startup lock until every configured axis is homed. Note the version (`$I`) in design.md, set `$22=11` (no init lock) in
      `tools/grblhal_settings.py`, `make build`, `bash scripts/controller.sh settings`: the software still refuses every move until it has homed and checked the position.'
    record: 10/10 in design.md.
  - id: M14.3
    title: Angle check
    time: 20 min
    needs:
    - protractor scale FRM-09c
    do:
    - '`opengonio move M4=90`, read the scale; `M4=180`; `M4=270`.'
    verify:
    - Each reading within ±0.5° of the command.
    fail:
    - 'Error grows with angle: wrong `gear_ratio`; ratio_new = ratio × commanded / read.'
    record: Three readings in design.md.
  - id: M14.4
    title: Repeatability
    time: 45 min
    needs:
    - LAR-09 laser + mirror
    - wall 2.0 m away
    do:
    - Laser on the deck, small mirror taped to the arm, spot on a wall 2.0 m away (0.1° = 7 mm).
    - '`opengonio repeat M4 --at 60 --away 30 --n 20`; type each spot offset (mm).'
    - '`opengonio repeat M4 --at 60 --home --n 10`'
    verify:
    - 'Both print `"pass": true` (every spot ≤ 7.0 mm from the mark).'
    fail:
    - 'Spread > 7 mm: pinion mesh (slide the mount in 0.5 mm), pulley grub tight on the motor flat, wobble in the lazy Susan.'
    record: Both JSON summaries in phases/04-light-arm/design.md → Results; commit.
- id: M15
  stage: 05-table
  title: Table axis built
  goal: Sample table turns on its fixed bolt axle without wobble.
  weeks: 1
  steps:
  - id: M15.1
    title: Print table parts
    time: 10 min
    wait: print 5 h
    needs:
    - stage-05 parts `have` in `PARTS.md`
    do:
    - Print `TBL-07a_table_drum`, 2 × `TBL-07b_home_flag` (tilt and spin), `TBL-07c_table_motor_bracket`, `TBL-07d_table_post`, `TBL-07f_spacers`, `TBL-07g_endstop_riser` (foot on the bed), `TBL-07h_table_flag` (as exported: bridge on the bed, fin up).
    verify:
    - A 608 presses into each drum seat by thumb and stays.
    - The M8 bolt head drops into the post's hex pocket from below and can't turn.
    record: Tick the boxes; `make done id=M15.1`.
  - id: M15.2
    title: Fixed axle and drum
    time: 45 min
    needs:
    - 2 × FRM-08 608
    - TBL-05 M8 × 75 bolt + nut
    - 1 mm shim + 6 mm spacer (TBL-07f)
    - 4 × M2 × 12 (FRM-06)
    - TLS-10 13 mm spanner
    do:
    - Bolt up through the post from below, head into the hex pocket. Post on its 4 pilots at the deck centre; 4 × M2 × 12 (the bolt is now trapped and can't turn).
    - 'Press both 608s into the drum. Onto the bolt: 1 mm shim (sits on the post top), the drum (lower 608 onto the bolt), 6 mm spacer down the drum''s top hole, M8 nut.'
    - Tighten the nut with the spanner until the drum has no up-down play but still turns freely (the nut presses only the inner races).
    verify:
    - 'Spin by hand ±180°: smooth, no click.'
    - 'Calipers on the drum top at 30 mm radius: height changes < 0.3 mm over a turn.'
    fail:
    - 'Tight spot: nut too tight; back it off 1/6 turn.'
    - 'Wobble: a 608 not pressed square into its seat.'
    record: Tick the boxes; `make done id=M15.2`.
  - id: M15.3
    title: Drive belt
    time: 30 min
    needs:
    - TBL-01 motor
    - TBL-02 232 mm belt
    - TBL-03 pulley
    - TBL-07c bracket
    - 4 × M3 × 8 (FRM-07)
    - 2 × M2 × 12 + washers
    do:
    - Motor face up, bracket top plate on its face (4 × M3 × 8); 20T pulley on the shaft, teeth level with the drum's teeth.
    - 'E-stop pressed: its cable into the SKR Pico Y socket, run along the deck edge (never plug or unplug a motor with motor power on).'
    - Belt on the motor pulley and the drum's teeth; bracket rails' slots over their 2 deck pilots (inside the lazy Susan, at 180°); pull it outward until the belt deflects ~3 mm under a finger; M2 × 12
      + washer through each slot.
    verify:
    - No belt skip when you hold the table and the motor turns slowly (`opengonio send 'G91' 'G1 Y5 F100' 'G90'` after M16.1).
    - Motor and bracket stay inside the lazy Susan opening (no contact when M4 turns).
    record: Commit.
- id: M16
  stage: 05-table
  title: Table homes and repeats
  goal: M3 returns to the same spot every time (≤ 0.1°).
  weeks: 1
  steps:
  - id: M16.1
    title: Flag and homing
    time: 30 min
    needs:
    - TBL-04 endstop
    - TBL-07g riser, TBL-07h flag
    - 3 × M2 × 10 + washers, 2 × M2 × 6, 2 × M2 × 8
    - CTL-06 leads (as M10.2)
    do:
    - 'Riser on the three deck pilots at x = 40 (y = −40, 0, +40; +X side, inside the lazy Susan opening), 3 × M2 × 10 + washer, post outward. Endstop on its pad: slot over the pad''s middle, header end outward, 2 × M2 × 6 self-tap.'
    - 'Flag on the drum top''s two flag holes (the close pair outside the four yoke pilots), 2 × M2 × 8 self-tap, fin hanging down outside the drum. Turn the table by hand: at −180° (fin on +X) the fin passes through the slot without touching either side.'
    - E-stop pressed. Lead into the SKR Pico Y-STOP socket, along the riser and the deck.
    - '`installed_phase: 5`; `opengonio home` ten times.'
    verify:
    - Home 10/10; after homing `opengonio status` shows MPos Y = 0 and true angle M3 = −180.
    record: 10/10 in design.md.
  - id: M16.2
    title: Angle check
    time: 15 min
    needs:
    - paper 360° protractor (any free printable, printed on TLS-08) taped on the drum top
    - a fixed pointer (tape on the post)
    do:
    - '`opengonio move M3=0`, `M3=90`, `M3=-90`; read the protractor against the pointer.'
    verify:
    - Each within ±0.5°.
    fail:
    - 'Scaled error: `M3.gear_ratio` = 100 / 20 = 5 only with the printed 100T pulley.'
    record: Readings in design.md.
  - id: M16.3
    title: Repeatability
    time: 45 min
    needs:
    - laser + mirror
    - wall 2.0 m
    do:
    - Mirror on the table; `opengonio repeat M3 --at 0 --away 45 --n 20`.
    verify:
    - '`"pass": true`.'
    record: JSON in phases/05-table/design.md → Results.
  - id: M16.4
    title: Both axes and collision guard
    time: 15 min
    needs:
    - M4 and M3 built
    do:
    - '`opengonio move M4=60 M3=30`'
    - '`opengonio move M4=10`'
    verify:
    - First move runs.
    - 'Second prints `refused: M4=10.0 outside [20.0, 324.0]` and nothing moves.'
    record: Commit `make publish m="M16 table done"`.
- id: M17
  stage: 06-camera-light
  title: Camera sees the zero point
  goal: Sharp, fixed-exposure image centred on the sample.
  weeks: 2
  steps:
  - id: M17.1
    title: Camera reaches the software
    time: 30 min
    needs:
    - CAM-01 camera
    - Windows PowerShell (or a Linux laptop)
    do:
    - 'WSL''s standard kernel has no USB-camera driver, so camera stages run `opengonio` from Windows Python. PowerShell, in the repo folder (`cd \\wsl.localhost\Ubuntu\home\<you>\projects\Gonioreflectometer-Open-Source`):'
    - '`py -m venv $HOME\og-win; & $HOME\og-win\Scripts\pip install "./software[hw]"`'
    - '`usbipd detach --busid <SKR Pico busid>` (Windows keeps it as a COM port); set `controller.port: COM5` (your port) in `machine.yaml`.'
    - '`& $HOME\og-win\Scripts\opengonio status`'
    verify:
    - '`status` prints `<Idle|` or `<Alarm|`.'
    - '`& $HOME\og-win\Scripts\python -c "import cv2; print(cv2.VideoCapture(0).read()[0])"` prints `True`.'
    fail:
    - '`False`: camera index is 1 (laptop webcam is 0); set `camera.index: 1`.'
    - 'Linux laptop instead: everything runs natively; `v4l2-ctl --list-devices` shows the camera.'
    record: Which setup you use in phases/06-camera-light/design.md → Results.
  - id: M17.2
    title: Mount
    time: 1.25 h
    wait: print 1 h
    needs:
    - CAM-01 camera
    - CAM-02 lens
    - CAM-03 prints
    - TLS-09 utility knife + 400-grit paper
    do:
    - 'Order the stage-06 parts ticked in `PARTS.md`, plus CAL-01 PTFE, CAL-02 mirror (stage 07): M17.5–M19 use them. Print `CAM-03a_aperture_stop_f8.stl`, `CAM-03b_camera_plate.stl`, `CAL-06a/b` holders.'
    - 'Camera board on the plate: 4 × M2 × 8 (FRM-06) self-tap into the 6 mm standoffs.'
    - 'Plate on the camera pillar: slide its clamp down to the pilot hole, M2 × 16 self-taps into it; aperture stop in front of the lens.'
    - 'White tile (CAL-01): mark one 100 × 100 mm PTFE sheet into four 50 mm squares (lines at 50 mm both ways); cut each line with the utility knife against a straight edge, 4–6 light passes, never through
      in one go. Stack 3 squares (9 mm) in the `CAL-06a` holder; sand the top one with 400 grit in circles until evenly matte; blow off the dust, don''t touch the face.'
    verify:
    - 'Tape measure zero point → lens front: 350 ± 2 mm; camera axis level (phone level app on the plate).'
    - PTFE stack sits flush with the holder rim; no shiny patches on the top face.
    record: Tick the boxes; `make done id=M17.2`.
  - id: M17.3
    title: Focus
    time: 30 min
    needs:
    - printed 1 mm grid
    do:
    - 'Grid at the zero point. Live view: Windows *Camera* app (or `guvcview` on Linux).'
    - Turn the lens for the sharpest grid; lock it with the M12 lock ring.
    verify:
    - 1 mm lines resolved across the whole image.
    record: Image as `phases/06-camera-light/focus.jpg`.
  - id: M17.4
    title: Centre
    time: 15 min
    needs:
    - table centre mark
    do:
    - Image the table centre mark; find its pixel position (any image viewer).
    verify:
    - Within ±15 px of the image centre (= ±0.5 mm).
    fail:
    - 'Off-centre: shim the camera board on its standoffs (paper or tape layers), or the plate''s clamp on the pillar.'
    record: Offset (px) in design.md.
  - id: M17.5
    title: Lock exposure and colour
    time: 30 min
    needs:
    - CAL-01 PTFE in its holder (or CAL-07 grey card if you bought it)
    do:
    - Lock exposure, gain, white balance (`v4l2-ctl` lines in `software/src/opengonio/camera/uvc.py`).
    - Two frames of the PTFE tile 60 s apart.
    verify:
    - Mean grey of the two frames differs < 1 %.
    fail:
    - 'Drifts: auto exposure still on; `v4l2-ctl -l` and set `auto_exposure=1`.'
    record: Locked values into `machine.yaml` → `camera:` (`exposure_ms`); commit.
- id: M18
  stage: 06-camera-light
  title: Lamp on and safe
  goal: Light switches from the laptop, stays cool and steady.
  weeks: 1
  steps:
  - id: M18.1
    title: Lamp assembly
    time: 1 h
    wait: print 2 h
    needs:
    - LSR-01 COB
    - LSR-06 holder
    - LSR-02 driver
    - LSR-03 heatsink
    - LSR-04 tape (3M 8810; the Wakefield heatsink comes without it)
    - LSR-05 print
    - PWR-15 18 AWG offcuts (2 × 15 cm)
    - PWR-20 lever connectors
    - TLS-04 stripper
    do:
    - Print `LSR-05a_lamp_tube`, `LSR-05b_lamp_cap`. Strip one end of a 15 cm red and a 15 cm black 18 AWG lead (PWR-15) to the length in the holder's instruction sheet; push red into the holder's `+` poke-in,
      black into `−`.
    - Holder face-down in the body's round seat, wire entries toward the lead groove (the side away from the clamp), leads along the groove. COB into the holder's square seat, light-emitting face down through
      the window. Thermal tape (LSR-04) on the COB's back; heatsink on top, fins out. Cap on with 4 × M2 × 12, leads through its slot; tighten evenly until the heatsink no longer turns.
    - Lamp clamp onto the arm bar's outer pilot (M2 × 16), aperture facing the zero point.
    - 'E-stop pressed, adapter unplugged (HE `+` carries motor-power voltage). Driver (LSR-02, NLDD-350HW) into the short frame on the controller tray (double-sided tape). Read which lead colour is which on its label.
      +Vin lead (bare 5 mm end) under the SKR Pico HE `+` screw (terminal marked 12/24V); −Vin lead under HE `−` (terminal marked IO23; output port from M08.2, normally `M62 P4`).'
    - 'Driver +Vo / −Vo leads → one lever connector each on the tray → two chains of 5 male–female jumpers along the arm (slack for 20–324°) → lever connectors at the lamp → the holder''s red (+) / black (−)
      lead. Jumper ends into lever connectors: plug cut off, stripped 11 mm, folded double. DIM lead alone in a 2-way lever connector (open = on; never tie it to −Vin).'
    verify:
    - Each lead holds when tugged (poke-in locked, levers closed).
    - 'Polarity checked with the meter before power: +Vo lead → holder red lead beeps.'
    record: Tick the boxes; `make done id=M18.1`.
  - id: M18.2
    title: Switch and heat
    time: 20 min
    needs:
    - TLS-05 temperature probe
    - '`installed_phase: 6`'
    do:
    - '`opengonio light on`; wait 10 min; `opengonio light off`. Repeat on/off 5 ×.'
    verify:
    - Lamp follows every command.
    - COB case ≤ 70 °C after 10 min.
    fail:
    - 'Lamp always on: driver −Vin on GND instead of HE `−` (the terminal marked IO23). Never lights: −Vin on HE `+`, or +Vo / −Vo swapped.'
    record: Temperature in phases/06-camera-light/design.md → Results.
  - id: M18.3
    title: Warm-up time
    time: 15 min
    wait: 10 min run
    needs:
    - PTFE tile or grey card
    - room dark
    do:
    - '`opengonio capture warmup --minutes 10 --out data/warmup`'
    - Set `lights.white.warmup_s` in `machine.yaml` to the printed value.
    verify:
    - '`settle_s` ≤ 300.'
    fail:
    - 'Longer: thermal pad missing or driver current too high (check LSR-02 is the 350 mA part).'
    record: '`settle_s`, `change_pct` in design.md; commit.'
- id: M19
  stage: 06-camera-light
  title: Mirror test
  goal: First real data proves the angles are right.
  weeks: 1
  steps:
  - id: M19.1
    title: Mirror sweeps
    time: 30 min
    needs:
    - CAL-02 mirror
    - CAL-06b holder (print)
    do:
    - Mirror in `CAL-06b_mirror_holder`, clamped on the table.
    - '`opengonio capture mirror --theta 20`, then `--theta 40`, then `--theta 60`.'
    - '`opengonio verify data/mirror_20 data/mirror_40 data/mirror_60`'
    - '`opengonio curve data/mirror_40`; open `data/mirror_40/curve.svg`.'
    verify:
    - Each `mirror_peak_error_deg` between −0.5 and +0.5.
    - The chart's peak sits within one dot of the orange line.
    fail:
    - 'Same sign every time: table zero offset — fixed in M22.2.'
    - 'No clear peak: mirror not facing the camera at M3 = 0; reseat the holder.'
    record: Three errors in phases/06-camera-light/design.md → Results; commit.
- id: M20
  stage: 06-camera-light
  title: First reflectance curves
  goal: Two real materials measured and pictured.
  weeks: 1
  steps:
  - id: M20.1
    title: Paper
    time: 20 min
    needs:
    - matte printer paper
    do:
    - Clamp the paper on the table.
    - '`opengonio capture inplane --step 10 --out data/paper`'
    - '`opengonio verify data/paper`'
    - '`opengonio curve data/paper`; open `curve.svg`.'
    verify:
    - 'verify: `lamp_drift_pct` within ±2, `result` PASS.'
    - 'Chart: flat-ish curves; centre_mean ÷ cos(θr) varies < 15 % for θr ≤ 60° at a fixed θi (from `curve.csv`).'
    fail:
    - 'Drift FAIL: raise `warmup_s`; check the lamp heatsink.'
    record: '`curve.csv` + `curve.svg` → `phases/06-camera-light/paper_*`.'
  - id: M20.2
    title: Glossy plastic
    time: 20 min
    needs:
    - acrylic sheet or flat LEGO plate
    do:
    - Clamp it.
    - '`opengonio capture inplane --step 10 --out data/plastic`; `opengonio verify data/plastic`; `opengonio curve data/plastic`.'
    verify:
    - Each θi curve peaks at θr = θi ± 10° (chart).
    record: '`curve.csv` + `curve.svg` → `phases/06-camera-light/plastic_*`; commit.'
- id: M21
  stage: 07-calibrate
  title: Dark box
  goal: Only the lamp lights the sample.
  weeks: 1
  steps:
  - id: M21.1
    title: Darken the room
    time: 20 min
    needs:
    - ENC-02 felt
    - curtains / door
    - tape over bright LEDs
    do:
    - Order the stage-07 parts ticked in `PARTS.md`. Felt behind the sample (opposite the camera).
    - Room lights off, curtains closed, tape over power LEDs that face the sample; laptop screen dimmed and turned away.
    - 'Only if M21.2 fails: build the optional drape (ENC-01 fabric on ENC-03 dowels in 4 printed `ENC-04a` sockets), vents of both boxes open.'
    verify:
    - Standing at the machine, you can't read this page without the lamp.
    record: Tick the boxes; `make done id=M21.1`.
  - id: M21.2
    title: Stray light test
    time: 15 min
    needs:
    - PTFE tile (CAL-01)
    - darkened room
    do:
    - PTFE at 45:0 (`opengonio move M4=45 M3=0`). Room lights on.
    - '`opengonio capture white --out data/stray_on`; then the same with the room light on: `--out data/stray_gap`.'
    verify:
    - 'Dark vs lit room: centre brightness differs < 0.5 % (`opengonio curve` each, compare `centre_mean`): ambient light is negligible.'
    fail:
    - 'Larger: find the source (window, monitor) and block it; if you can''t, build the optional drape (M21.1) and repeat.'
    record: Both values in phases/07-calibrate/design.md → Results.
  - id: M21.3
    title: Dark level
    time: 10 min
    needs:
    - room dark (drape closed if built)
    do:
    - '`opengonio capture dark`'
    - '`opengonio calibrate dark data/dark`'
    verify:
    - '`opengonio calibrate show` lists `dark_counts` < 10 with today''s date.'
    fail:
    - 'High: light leak or camera gain not locked (M17.5).'
    record: Commit `software/config/calibration.yaml`.
- id: M22
  stage: 07-calibrate
  title: Camera response and angle calibration
  goal: Linear brightness and true angles.
  weeks: 1
  steps:
  - id: M22.1
    title: Camera response
    time: 20 min
    needs:
    - PTFE at the zero point
    - M21.3 done
    do:
    - '`opengonio capture linearity`'
    - '`opengonio calibrate linearity data/linearity`'
    verify:
    - '`r2` ≥ 0.995 and `gamma` between 0.9 and 2.6; `points_used` ≥ 4.'
    fail:
    - '`points_used` < 3: change `--exposures` so the brightest is just below saturation (e.g. `--exposures 1 2 4 8 16 32`).'
    record: '`gamma`, `r2` in design.md; commit `calibration.yaml`.'
  - id: M22.2
    title: Angle offset
    time: 45 min
    needs:
    - mirror holder
    do:
    - '`opengonio capture mirror --theta 20` … repeat for 30, 40, 50, 60.'
    - '`opengonio calibrate mirror data/mirror_20 data/mirror_30 data/mirror_40 data/mirror_50 data/mirror_60`'
    - '`opengonio capture mirror --theta 40 --out data/mirror_40_after`; `opengonio verify data/mirror_40_after`'
    verify:
    - '`calibrate` prints five errors and `M3_offset_deg`.'
    - 'After: `mirror_peak_error_deg` within ±0.2.'
    fail:
    - 'Errors grow with θ: M4 gear ratio wrong (M14.3), not an offset.'
    record: Five errors + offset in design.md; commit `calibration.yaml`.
- id: M23
  stage: 07-calibrate
  title: Brightness calibration
  goal: Values in real reflectance units (1/sr).
  weeks: 1
  steps:
  - id: M23.1
    title: White reference
    time: 15 min
    needs:
    - CAL-01 PTFE in CAL-06a holder
    do:
    - '`opengonio capture white`'
    - '`opengonio calibrate white data/white --rho 0.99` (ρ from the PTFE datasheet).'
    verify:
    - '`calibrate show` lists `white` with today''s date and `exposure_ms` = your locked exposure.'
    record: Commit `calibration.yaml`.
  - id: M23.2
    title: PTFE check
    time: 20 min
    needs:
    - PTFE still mounted
    do:
    - '`opengonio capture inplane --step 10 --out data/ptfe`; `opengonio curve data/ptfe`.'
    verify:
    - '`brdf_per_sr` = 0.315 ± 5 % for θi ≤ 60°, θr ≤ 60° (0.99 / π).'
    fail:
    - 'Falls with θi: lamp spot smaller than the sample at grazing angles — check the aperture in LSR-05.'
    - 'Uniformly off: exposure changed since `calibrate white`; redo M23.1.'
    record: Min / max `brdf_per_sr` in design.md.
  - id: M23.3
    title: Reciprocity
    time: 30 min
    needs:
    - matte swatch (card or paper)
    do:
    - '`opengonio capture inplane --step 10 --out data/matte`; `opengonio curve data/matte`.'
    - Compare rows (θi, θr) = (30, 50) and (50, 30).
    verify:
    - The two `brdf_per_sr` values agree within 5 %.
    fail:
    - 'Larger: angle calibration (M22.2) or stray light (M21.2).'
    record: Both values in design.md; commit.
- id: M24
  stage: 07-calibrate
  title: First game material
  goal: A measured swatch looks right in Blender, Unreal or Unity.
  weeks: 1
  steps:
  - id: M24.1
    title: Measure
    time: 40 min
    needs:
    - glossy plastic swatch
    do:
    - '`opengonio capture inplane --step 5 --out data/swatch`'
    - '`opengonio verify data/swatch`; `opengonio curve data/swatch`'
    verify:
    - '`result` PASS (or WARN with only `saturated` ≤ 5 % of shots).'
    - '`curve.csv`: `brdf_per_sr` filled on every unsaturated row.'
    record: Tick the boxes; `make done id=M24.1`.
  - id: M24.2
    title: Fit
    time: 10 min
    needs:
    - M24.1
    do:
    - '`opengonio fit data/swatch`; open `data/swatch/fit.svg`.'
    verify:
    - '`rms_pct_of_peak` < 10.'
    - Fitted lines pass through the dots around each peak.
    fail:
    - 'Big error only near grazing angles: normal; refit with `--step 10` data, or ignore θ > 70°.'
    record: Copy `fit.json` to `phases/07-calibrate/swatch_fit.json`.
  - id: M24.3
    title: In a game engine
    time: 1 h
    needs:
    - Blender (free), Unreal or Unity
    - photo of the swatch at θi = 40°
    do:
    - 'New material with the values under `engines` in `fit.json` (Blender: Principled BSDF Base Color, Roughness, Metallic).'
    - Plane + point light at 40° from the normal, camera at the mirror angle; render.
    verify:
    - 'Side by side with the photo: highlight size and position match by eye.'
    record: '`phases/07-calibrate/render_vs_photo.png`; commit `make publish m="M24 first material"`.'
- id: M25
  stage: 08-tilt
  title: Tilt yoke built and homed
  goal: Sample tilts without leaving the zero point.
  weeks: 2
  steps:
  - id: M25.1
    title: Print
    time: 10 min
    wait: print 9 h
    needs:
    - stage-08 and stage-09 parts `have` in `PARTS.md`
    do:
    - Print `TLT-07a_tilt_yoke.stl` (upright, 184 mm tall), `TLT-07b_pulley_100T.stl`, `TLT-07c_tilt_cradle.stl`, `SPN-07a_spin_platter.stl` (top face down).
    verify:
    - A 608 presses into each arm seat; an M8 nut drops into each cradle trap and can't turn.
    record: Tick the boxes; `make done id=M25.1`.
  - id: M25.2
    title: Cradle, platter and stub axles
    time: 1 h
    needs:
    - 2 × 608
    - TLT-05 2 × M8 × 35 + nuts
    - spacers (TBL-07f)
    - SPN-01 pancake motor
    - 4 × M3 × 8 (FRM-07), 4 × M2 × 12
    - M2 × 6 + M2 nut
    - TLS-10 spanner
    do:
    - 'Pancake motor under the cradle floor (shaft up through it, 4 × M3 × 8). Platter on the shaft: M2 nut in its slot, M2 × 6 through the hub onto the D flat; platter top level with the stub-bolt axis
      (the end blocks stand 10 mm higher).'
    - 'Yoke on the drum (4 × M2 × 12 self-tap into the OG-40 pilots) with its arms along ±Y: at M3 = 0 the tilt axis is square to the camera direction (+X) and the flag holes on the drum stay clear. The
      pulley-side arm is +Y.'
    - 'Pulley side: bolt through 100T pulley → 1 mm shim → 608 (outer face of the arm) → 6.8 mm spacer → cradle nut. Other side: the same with the 9.4 mm spacer instead of the pulley. Hold each bolt head
      with the spanner; snug, not tight.'
    verify:
    - Cradle tilts ±90° by hand, no play you can feel at the platter edge.
    - Platter top level with the bolt axis (ruler across both bolt centres).
    fail:
    - 'Binds: over-tightened; back off 1/6 turn.'
    record: Tick the boxes; `make done id=M25.2`.
  - id: M25.3
    title: Tilt drive and flag
    time: 45 min
    needs:
    - TLT-01 motor
    - TLT-02 280 mm belt
    - TLT-03 pulley
    - TLT-04 endstop
    - TBL-07b flag
    - 4 × M3 × 16 (FRM-07; through the 12 mm arm into the motor)
    do:
    - 'E-stop pressed: motor cable into the SKR Pico Z1 socket first, along the yoke arm with slack for the table''s ±180°.'
    - Motor on the inner face of the pulley-side arm above the axis, shaft out through the arm slot (4 × M3 × 16 in the slots; the arm is 12 mm thick); 20T pulley outside, level with the 100T; belt on; slide the motor up to tension
      (~3 mm deflection); tighten.
    - Flag on a cradle end block at −90°; endstop on the arm; lead into the SKR Pico Z-STOP socket (CTL-06, as M10.2).
    verify:
    - '`?` shows `Pn:Z` with the flag in the slot.'
    - Belt doesn't skip when you hold the platter and jog `M2` slowly.
    record: Tick the boxes; `make done id=M25.3`.
  - id: M25.4
    title: Home and repeat
    time: 1 h
    needs:
    - laser + mirror
    - wall 2.0 m
    do:
    - '`installed_phase: 8`; `opengonio home` × 10.'
    - '`opengonio move M2=0`: platter vertical (phone level app on its face).'
    - 'Mirror on the platter: `opengonio repeat M2 --at 0 --away 30 --n 20`.'
    verify:
    - Home 10/10.
    - Platter vertical within ±0.5° at M2 = 0.
    - '`"pass": true`.'
    record: JSON in phases/08-tilt/design.md → Results.
  - id: M25.5
    title: Zero point stays
    time: 20 min
    needs:
    - sample-centre mark
    do:
    - '`opengonio move M2=-45`, capture a frame; `M2=45`, capture a frame; compare the mark position.'
    verify:
    - Mark moves < 15 px (0.5 mm).
    fail:
    - 'Larger: platter surface not on the bolt axis; move the platter on the shaft (grub) and redo.'
    record: Shift (px) in design.md; commit.
- id: M26
  stage: 08-tilt
  title: Full isotropic scan
  goal: All light directions, unattended.
  weeks: 1
  steps:
  - id: M26.1
    title: Plan check
    time: 5 min
    needs:
    - '`installed_phase: 8`'
    do:
    - '`opengonio plan isotropic --step 15`'
    verify:
    - '`poses` ≥ 100 and `axes` includes `M2`.'
    record: Tick the boxes; `make done id=M26.1`.
  - id: M26.2
    title: Run
    time: 10 min
    wait: ~15 min unattended
    needs:
    - glossy plastic swatch on the yoke
    do:
    - '`opengonio capture isotropic --step 15 --out data/iso_plastic` (or station job *Isotropic 15deg*).'
    - Don't touch the machine until it finishes.
    verify:
    - '`opengonio verify data/iso_plastic`: PASS, or WARN with only `saturated` ≤ 5 % of shots.'
    record: Tick the boxes; `make done id=M26.2`.
  - id: M26.3
    title: Fit and compare
    time: 15 min
    needs:
    - M24 swatch fit
    do:
    - '`opengonio curve data/iso_plastic && opengonio fit data/iso_plastic`'
    verify:
    - Roughness within 10 % of the in-plane fit (M24.2) for the same swatch.
    fail:
    - 'Very different: check M2 zero (M25.4) — a tilt offset biases out-of-plane rows.'
    record: Both fits in phases/08-tilt/design.md → Results; commit.
- id: M27
  stage: 09-spin
  title: Spin wired and homed
  goal: Sample spins on its own axis (direct drive).
  weeks: 1
  steps:
  - id: M27.1
    title: Wire the spin motor
    time: 40 min
    needs:
    - spare LAR-02 motor cable
    - 3 × WAGO 221-412 + 1 × 221-415 (PWR-20)
    - TLS-04 stripper
    - multimeter
    - SPN-04 endstop
    - TBL-07b flag
    - CTL-06 leads
    - jumpers
    do:
    - 'The pancake (SPN-01) has bare leads. Find its coil pairs: touch two leads together and turn the shaft by hand; noticeably stiffer = one pair (or the meter: a pair reads a few ohms, two leads from
      different pairs read open). Tape-label them pair 1 and pair 2.'
    - 'Spare 5-pack cable: cut off the 6-pin (motor-end) plug, strip 11 mm of each of its 4 wires, twist the strands. At the 4-pin XH plug, note which wire colour sits in pins 1 + 4 (board labels 2B, 2A:
      one driver coil) and 2 + 3 (1B, 1A: the other), from the SKR Pico schematic.'
    - '3 × WAGO 221-412 + 1 × 221-415 (one motor lead and one cable wire in each): pair 1''s two leads to the wires of plug pins 1 and 4; pair 2''s two leads to the wires of pins 2 and 3. Tug-test each; tape the four connectors together. Check:
      meter at the plug, 1–4 and 2–3 read a few ohms, 1–2 open. Table: README → Wiring → 3.'
    - E-stop pressed. XH plug into the SKR Pico E socket (route the cable along the yoke arm with slack for ±90° tilt and ±180° table).
    - Flag on the platter rim (2 × M2 × 8), endstop on the cradle.
    - 'Endstop lead into E0-STOP (3-pin: signal, GND, 5 V, as M10.2): grblHAL uses it as the A limit.'
    verify:
    - Platter turns 360° by hand with the motor unpowered; face runout < 0.3 mm at 40 mm radius.
    - '`?` shows `Pn:A` with the flag in the slot.'
    fail:
    - 'No `Pn:A`: lead order wrong at the module end (S, G, V), or the firmware was built with 3 axes (rebuild with 4).'
    - 'Spin motor buzzes, no turn: a lead from each coil on one driver coil; redo the pair test (plug 1–4 and 2–3 must each read a few ohms).'
    - 'Turns the wrong way: `$3` A bit (8), as in M08.3.'
    record: Tick the boxes; `make done id=M27.1`.
  - id: M27.2
    title: Home and repeat
    time: 45 min
    needs:
    - laser + mirror
    do:
    - '`installed_phase: 9`; `opengonio home`.'
    - 'Mirror on the platter: `opengonio repeat M1 --at 0 --away 90 --n 20`.'
    verify:
    - '`"pass": true`.'
    record: JSON in phases/09-spin/design.md → Results; commit.
- id: M28
  stage: 09-spin
  title: Anisotropic material measured
  goal: 'Brushed metal: highlight depends on direction.'
  weeks: 1
  steps:
  - id: M28.1
    title: Spin sweep
    time: 30 min
    needs:
    - brushed aluminium swatch
    - tape arrow on the brushing direction
    do:
    - Clamp the swatch, arrow at M1 = 0.
    - '`opengonio capture spin --theta 30 --step 15 --out data/spin_brushed`'
    - '`opengonio curve data/spin_brushed`'
    verify:
    - '`centre_mean` max ÷ min ≥ 2 across M1 (curve.csv).'
    - Brightest when the arrow is vertical, i.e. grooves perpendicular to the light–camera plane (note that M1).
    fail:
    - '< 2×: swatch not brushed enough, or polished; try a different piece.'
    record: Max/min ratio and brightest M1 in phases/09-spin/design.md → Results.
  - id: M28.2
    title: Anisotropic set
    time: 10 min
    wait: ~1.5 h unattended
    needs:
    - same swatch
    do:
    - '`opengonio capture anisotropic --step 15 --phi-step 30 --out data/aniso_brushed`'
    - '`opengonio verify data/aniso_brushed`'
    verify:
    - PASS, or WARN with only `saturated` ≤ 5 % of shots.
    record: Tick the boxes; `make done id=M28.2`.
  - id: M28.3
    title: Why it needs 4 angles
    time: 15 min
    needs:
    - M28.2
    - M26.3 plastic fit
    do:
    - '`opengonio curve data/aniso_brushed && opengonio fit data/aniso_brushed`'
    verify:
    - '`rms_pct_of_peak` for brushed ≥ 2 × the plastic''s (an isotropic model can''t fit it).'
    record: Both RMS values in design.md; commit.
- id: M29
  stage: 10-color
  title: Spectral sensor (optional kit)
  goal: Colour spectrum of the spot at the zero point; camera stays for images.
  weeks: 1
  steps:
  - id: M29.1
    title: Mount
    time: 30 min
    wait: print 1 h
    needs:
    - SPC-01 AS7341
    - SPC-03 print
    - 2 × M2 × 8 + 3 × M2 × 16
    do:
    - Print `SPC-03a_spectral_tube.stl`; screw the AS7341 to it (2 × M2 × 8).
    - Clamp it on the camera pillar just above the camera (M2 × 16 into the z 181 pilot); aim at the zero point.
    verify:
    - 'Looking down the tube: the zero point is centred.'
    record: Tick the boxes; `make done id=M29.1`.
  - id: M29.2
    title: Wire and read
    time: 20 min
    needs:
    - SPC-02 cable
    do:
    - 'SPC-02 cable: SDA (blue) → ESP32-S3 J3-4 (GPIO 1), SCL (yellow) → J3-5 (GPIO 2), VIN (red) → 3V3 lever connector (fed from J1-2), GND (black) → sensor GND lever connector (fed from J3-22) (same bus as the OLED: README → Wiring → 8).'
    - '`bash scripts/hub.sh`; `python -m serial.tools.miniterm /dev/ttyACM1 115200` (the hub''s port); type `SPEC?`.'
    verify:
    - Reply `SPEC` + 10 numbers; covering the tube drops all to < 5 % of uncovered.
    fail:
    - '`ERR`: SDA/SCL swapped, or no 3V3.'
    record: Wiring check in phases/10-color/design.md → Results.
  - id: M29.3
    title: Aim angle
    time: 10 min
    needs:
    - ruler
    do:
    - Measure the tube axis height h above the camera axis (mm).
    - Set `spectral.elevation_deg` = atan(h / 350) in `machine.yaml`.
    verify:
    - '`make test` passes.'
    record: h and the angle in design.md.
  - id: M29.4
    title: Spectral curves
    time: 45 min
    needs:
    - PTFE
    - red paper
    - blue paper
    do:
    - '`opengonio capture inplane --step 10 --spectral --out data/ptfe_spec`; same for `red_spec`, `blue_spec`.'
    - '`opengonio curve data/ptfe_spec data/red_spec data/blue_spec`'
    verify:
    - 'PTFE repeated twice: F1–F8 within 3 %.'
    - Red ÷ PTFE highest in F7–F8; blue ÷ PTFE highest in F2–F3.
    record: Ratios in design.md; commit.
- id: M30
  stage: 10-color
  title: LED bank and polarizers (optional kit)
  goal: 'Polarizers: shine separated from colour. **LED bank BLOCKED**: its driver circuit is unsafe as designed (stage 10 design.md); do not wire or power MSK-01…03 - mark M30.1–M30.3 n/a. Without the
    bank scans leave out the photometric set.'
  weeks: 2
  steps:
  - id: M30.1
    title: Print and fit LEDs
    time: 2 h
    wait: print 3 h
    needs:
    - MSK-01 LEDs
    - MSK-04 heatsink
    - MSK-06 prints
    do:
    - Print `MSK-06a_led_ring.stl`, `MSK-06b_led_mast.stl`.
    - 7 pre-wired LED stars in slots 1–7 of the ring (slot 8 spare), thermal pad, wavelength written next to each.
    verify:
    - Ring on the mast at 40° elevation (angle gauge).
    record: Tick the boxes; `make done id=M30.1`.
  - id: M30.2
    title: Driver wiring
    time: 1 h
    needs:
    - MSK-02 driver
    - 2 × MSK-03 MOSFET modules
    - TLS-09 double-sided tape
    do:
    - '**STOP - blocked (stage 10 design.md): skip this step and M30.3; tick them n/a.** The text below is kept for the reviewed design.'
    - Both MOSFET modules on the deck beside the controller tray (M2 into spare pilots, or double-sided tape); driver MSK-02 pins up beside them, female jumper ends on its pins.
    - Each LED's + lead → driver +Vo (lever connector); its − lead → one module OUT terminal (screw). Module DC+ / DC− ← driver +Vo / −Vo. Inputs ← ESP32-S3 GPIO 8–14 and 21, input GND ← ESP32-S3 GND. Driver
      supply switched by the SKR Pico HB output (`M62 P3`).
    verify:
    - 'Continuity: each GP pin → its module input; each OUT terminal → one LED cathode.'
    record: Tick the boxes; `make done id=M30.2`.
  - id: M30.3
    title: Band test
    time: 15 min
    needs:
    - '`installed_phase: 10`'
    - '`lights.multispectral.built: true`'
    do:
    - 'Hub: `BAND 0` … `BAND 7`, then `BAND OFF`.'
    - '`opengonio check-pose M4=60 M3=30`'
    verify:
    - Exactly one LED per command.
    - '`"safe": true` with the mast fitted.'
    record: Band → wavelength table in phases/10-color/design.md → Results.
  - id: M30.4
    title: Polarizers
    time: 30 min
    needs:
    - MSK-05 film
    - mirror
    do:
    - Film in the lamp slot; film disc on the lens.
    - Mirror at the specular pose; turn the lens disc to the darkest image, then 90°.
    verify:
    - Crossed ÷ parallel brightness ≤ 1/20.
    record: Both values in design.md; commit.
- id: M31
  stage: 11-scan-capture
  title: Scan hardware
  goal: Scan camera fixed at 650 mm, object held securely; nothing on the measuring side moves.
  weeks: 1
  steps:
  - id: M31.1
    title: Print risers and scan plate
    time: 10 min
    wait: print 3 h
    needs:
    - SCN-03 prints
    do:
    - Print `SCN-03a/b/c` risers, `SCN-03d_scan_camera_plate_15.stl` and a second `CAM-03a_aperture_stop_f8.stl`.
    verify:
    - Risers sit flat on the platter.
    - 'Scan plate: its face leans 15° to its clamp channel (phone level app: 75° on the face with the channel vertical).'
    record: Tick the boxes; `make done id=M31.1`.
  - id: M31.2
    title: Mount the scan camera
    time: 45 min
    needs:
    - scan post at x = 674.4 (M12.1)
    - 4 × M2 × 8 + 1 × M2 × 16 (FRM-06)
    - CAM-04 camera + CAM-05 lens (optional kit), or the measuring camera moved here
    do:
    - The scan post stands on the outrigger at x = 674.4 mm since M12.1 (lens 650 mm from the zero point, 15° down).
    - 'Camera board on the scan plate''s standoffs (4 × M2 × 8); plate on the post, M2 × 16 into its pilot: lens centre 168 mm above the zero point (318 mm above the deck), looking 15° down.'
    - Focus on the zero point (M17.3 method) and lock the lens; aperture stop on.
    - Plug it in; `machine.yaml` → `scan.camera_index` = its index (usually 1); `opengonio scan plan`.
    verify:
    - '`scan plan` prints `two_cameras: true` and both clearances > 0.'
    - 'Scan camera image: zero point within ±15 px of centre; the measuring camera is not in the picture.'
    - 1 mm grid resolved at the zero point.
    fail:
    - 'Measuring camera visible at the bottom edge: raise the scan camera (bigger `scan.camera_elevation_deg`, re-check with `scan plan`).'
    - 'One-camera option (no CAM-04/05): move the measuring camera to this post, refocus, set `scan.camera_index` = `camera.index`; move it back and redo M17.3–M17.5 before measuring BRDFs.'
    record: Index, height and the clearance numbers in phases/11-scan-capture/design.md → Results.
  - id: M31.3
    title: Putty hold (S3)
    time: 20 min
    needs:
    - SCN-01 putty
    - 100 g object
    - SCN-02 ChArUco mat
    do:
    - Object on the riser with putty; `opengonio move M2=80`; spin `M1` three turns (`opengonio move M1=180` … `-180`).
    verify:
    - Mat corners move ≤ 1 px between turn 1 and turn 3.
    record: S3 in `phases/11-scan-capture/test.csv`.
- id: M32
  stage: 11-scan-capture
  title: Camera position calibrated
  goal: Every photo's pose known to 0.3 mm.
  weeks: 1
  steps:
  - id: M32.1
    title: ChArUco board
    time: 20 min
    needs:
    - CAL-04 print + glass
    do:
    - Print the ChArUco board at 100 %; glue flat under the picture-frame glass.
    verify:
    - Square size = 10.0 ± 0.1 mm (calipers).
    record: Tick the boxes; `make done id=M32.1`.
  - id: M32.2
    title: Calibrate
    time: 30 min
    needs:
    - board on the platter
    do:
    - '`opengonio scan calibrate`'
    - Copy the printed file path into `scan.calibration` in `machine.yaml`.
    verify:
    - S1 reprojection RMS ≤ 0.5 px; S2 ≤ 0.2° and ≤ 0.3 mm (both printed).
    fail:
    - 'S1 high: blurry board → refocus; board not flat → re-glue.'
    record: S1, S2 in `test.csv`; commit.
- id: M33
  stage: 11-scan-capture
  title: First full scan
  goal: 144 photos (plus the photometric set with the optional LED bank), unattended.
  weeks: 1
