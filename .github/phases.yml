- id: M36
  stage: 13-object-material
  title: Textures on the mesh
  goal: Colour per texel from the scan photos.
  weeks: 2
  steps:
  - id: M36.1
    title: Write the texture tool
    time: 4 h
    needs:
    - Python
    - M35 mesh
    do:
    - 'New file `software/src/opengonio/scan/texture.py`: `bake(mesh, scan_dir) -> albedo.png` — project each texel into every image where it faces the camera, average linear values (gamma from `calibration.yaml`).'
    - 'Test `software/tests/test_texture.py`: synthetic sphere with a known albedo pattern (reuse `scan.demo`).'
    verify:
    - '`make test` passes; the test recovers albedo within 5 %.'
    record: Commit the tool + test.
  - id: M36.2
    title: Bake the car
    time: 1 h
    needs:
    - M35.4 car
    do:
    - UV-unwrap (Blender Smart UV Project), export OBJ; bake with 10 % of images held out.
    verify:
    - 'Re-rendered held-out views vs photos: mean absolute error ≤ 10 %.'
    record: Error in phases/13-object-material/design.md → Results; commit.
- id: M37
  stage: 13-object-material
  title: Object in a game engine
  goal: The scanned object looks real.
  weeks: 1
  steps:
  - id: M37.1
    title: Export glTF
    time: 30 min
    needs:
