- id: M41
  stage: 15-standalone
  title: Pi Zero station set up
  goal: Pi drives the SKR Pico over USB and grabs camera frames.
  weeks: 1
  steps:
  - id: M41.1
    title: SD card
    time: 20 min
    needs:
    - STA-01 Pi Zero 2 W
    - STA-02 microSD
    - Raspberry Pi Imager
    do:
    - 'Imager: Pi OS Lite 64-bit; hostname `opengonio`; SSH on; your WiFi; your user.'
    verify:
    - Pi boots; `ssh <you>@opengonio.local` logs in.
    record: Tick the boxes; `make done id=M41.1`.
  - id: M41.2
    title: Buck and UART
    time: 45 min
    needs:
    - STA-03 buck
    - STA-04 OTG adapter
    - TLS-05 multimeter
    - cut jumpers
    do:
    - 'Buck input: adapter unplugged first. A thin red / black pair under the jack''s `+` / `−` screws beside the wires already there (before the e-stop, so the Pi stays on when the motors stop).'
    - 'Set the output **before anything is on it**: nothing on the buck output, adapter in, meter (DC volts) on the output terminals; turn the trim screw until it reads 5.1 V (it can start near 24 V: many turns).
      Unplug the adapter.'
    - A powered USB hub on the Pi's OTG port (STA-04) carries the camera(s) and the SKR Pico's USB-C cable.
    - 'Wire buck output, UART and hub power per README → Wiring → 9: buck 5.1 V → Pi pin 2, buck − → Pi pin 14; Pi pin 8 (GPIO14 TX) → hub J3-16 (GPIO 48), Pi pin 10 (GPIO15 RX) ← hub J3-17 (GPIO 47), Pi
      pin 6 → hub J3-1 (GND), Pi pin 4 (5V) → hub J1-21 (5V); never with the hub''s USB in the laptop at the same time.'
    - 'Adapter in: the Pi boots. Meter on the buck output terminals: 5.05–5.15 V (the Verify line).'
    verify:
    - Buck output 5.05–5.15 V under the Pi's load.
    record: Tick the boxes; `make done id=M41.2`.
  - id: M41.3
    title: Install the station
    time: 20 min
    needs:
    - M41.2
    do:
    - '`bash scripts/station.sh <you>@opengonio.local`; then `ssh <you>@opengonio.local sudo reboot`.'
    verify:
    - '`ssh <you>@opengonio.local journalctl -u opengonio-station -n 20` shows `station ready`.'
    - OLED shows the first job name.
    record: Commit.
